<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bolão Copa do Mundo - Antas</title><style>:root { --primary: #0f5132; --primary-dark: #082e1c; --accent: #ffc107; --bg: #f3f7f5; --surface: #ffffff; --text: #1c2421; --text-muted: #606f69; --border: rgba(15,81,50,0.08); --radius: 24px; --radius-sm: 14px; --shadow: 0 20px 40px rgba(15,81,50,0.04) } * { box-sizing: border-box; margin: 0; padding: 0 } body { font-family: 'Plus Jakarta Sans',sans-serif; background-color: var(--bg); color: var(--text); line-height: 1.6; padding-bottom: 80px } header { background: linear-gradient(135deg,var(--primary-dark) 0%,var(--primary) 100%); color: #fff; text-align: center; padding: 60px 20px 80px 20px; border-radius: 0 0 var(--radius) var(--radius); position: relative } header h1 { font-size: 2.6rem; font-weight: 700; letter-spacing: -1.5px; margin-bottom: 10px } header p { font-size: 1.1rem; opacity: .85; font-weight: 500; background: rgba(255,255,255,0.1); padding: 6px 16px; border-radius: 100px; display: inline-block } .container { max-width: 880px; margin: -40px auto 0 auto; padding: 0 16px; position: relative; z-index: 10 } .card { background: var(--surface); padding: 30px 20px; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 35px; border: 1px solid var(--border) } h2 { font-size: 1.5rem; font-weight: 700; color: var(--primary-dark); margin-bottom: 25px; letter-spacing: -0.5px } .ranking-table { width: 100%; border-collapse: collapse; text-align: left } .ranking-table th { background-color: rgba(15,81,50,0.04); color: var(--text-muted); font-weight: 600; padding: 18px; font-size: .9rem; text-transform: uppercase; letter-spacing: 1px; border-radius: var(--radius-sm) var(--radius-sm) 0 0 } .ranking-table td { padding: 18px; border-bottom: 1px solid var(--border); font-size: 1rem } .sem-dados { text-align: center; color: var(--text-muted); padding: 50px 18px!important; font-style: italic } .part-lista { display: flex; flex-direction: column; gap: 15px } .part-item { display: flex; align-items: center; padding: 20px 25px; background: rgba(15,81,50,0.02); border: 1px solid var(--border); border-radius: var(--radius-sm); justify-content: space-between; transition: all .3s ease } .btn-palpites { background: linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%); color: #fff; border: none; padding: 10px 22px; border-radius: 100px; font-weight: 600; cursor: pointer; font-family: inherit; font-size: .95rem; box-shadow: 0 10px 20px rgba(15,81,50,0.15); transition: all .3s ease } .jogos-lista { display: flex; flex-direction: column; gap: 18px } .jogo-card { display: flex; flex-direction: column; padding: 16px 12px; background: var(--surface); border-radius: var(--radius-sm); border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.02); transition: all .3s ease; gap: 12px } .jogo-principal { display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 8px } .time-container { flex: 1; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 1rem; color: var(--text) } .time-container.casa { justify-content: flex-end; text-align: right } .time-container.fora { justify-content: flex-start; text-align: left } .bandeira { font-size: 1.4rem; flex-shrink: 0 } .placar-container { display: flex; flex-direction: column; align-items: center; gap: 4px; flex-shrink: 0; width: 125px } .placar-wrapper { display: flex; align-items: center; gap: 6px } .placar-box { width: 38px; height: 38px; background: rgba(15,81,50,0.03); border: 2px solid var(--border); border-radius: 10px; text-align: center; font-size: 1.1rem; font-weight: 700; color: var(--primary-dark); display: flex; align-items: center; justify-content: center } .divisor { font-weight: 700; color: rgba(15,81,50,0.3); font-size: .85rem } .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(8,46,28,0.4); backdrop-filter: blur(8px); z-index: 100; align-items: center; justify-content: center; padding: 16px } .modal.ativo { display: flex } .modal-conteudo { background: var(--surface); padding: 30px 16px; border-radius: var(--radius); max-width: 650px; width: 100%; max-height: 85vh; overflow-y: auto } .modal-fechar { position: absolute; top: 20px; right: 16px; border: none; cursor: pointer; font-size: 1.3rem } .aviso-r2 { background: var(--accent); padding: 15px; border-radius: 12px; font-weight: 700; color: var(--primary-dark); text-align: center; margin-bottom: 20px; }</style></head><body><header><h1>Bolão Copa do Mundo</h1><p>Grupo Oficial: Os Antas 🐗</p></header>
<div class="container"><div class="card"><h2>Classificação Geral</h2><div class="table-container"><table class="ranking-table"><thead><tr><th>Posição</th><th>Participante</th><th style="text-align:center">Points</th></tr></thead><tbody id="tabela-ranking"><tr><td colspan="3" class="sem-dados">Calculando...</td></tr></tbody></table></div></div><div class="card"><h2>Painel de Evolução 📈</h2><div class="evolucao-container" id="painel-evolucao"></div></div><div class="card"><h2>Participantes</h2><div class="part-lista" id="lista-participantes"></div></div>
<div class="card"><h2>SEGUNDA RODADA</h2><div class="aviso-r2">Mandar palpites no privado do @walisontm até 12h59 da quinta 18/06</div><div class="jogos-lista" id="lista-r2"></div></div>
<div class="card"><h2>Jogos & Resultados (Rodada 1)</h2><div class="jogos-lista" id="lista-jogos-principal"></div></div></div>
<div id="modal-palpites" class="modal"><div class="modal-conteudo"><button class="modal-fechar" onclick="fecharPalpites()">&times;</button><h2 id="modal-titulo">Palpites</h2><div class="jogos-lista" id="modal-lista-jogos"></div></div></div>
<script>
const dadosPalpites = { "Walishow": { j1_a: "2", j1_b: "0", j19_a: "2", j19_b: "0" }, "Paulão": { j1_a: "2", j1_b: "0", j19_a: "2", j19_b: "0" } };
const resultadosFinais = { j1_a: "2", j1_b: "0", j19_a: "3", j19_b: "0" };
const estruturaJogos = [ {tA:"México",bA:"🇲🇽",tB:"África do Sul",bB:"🇿🇦",idA:"j1_a",idB:"j1_b"}, {tA:"Argentina",bA:"🇦🇷",tB:"Argélia",bB:"🇩🇿",idA:"j19_a",idB:"j19_b"} ];
const r2 = [
    {tA:"República Tcheca",tB:"África do Sul"}, {tA:"Suíça",tB:"Bósnia e Herzegovina"}, {tA:"Canadá",tB:"Catar"}, {tA:"México",tB:"Coreia do Sul"},
    {tA:"EUA",tB:"Austrália"}, {tA:"Escócia",tB:"Marrocos"}, {tA:"Brasil",tB:"Haiti"}, {tA:"Turquia",tB:"Paraguai"},
    {tA:"Países Baixos",tB:"Suécia"}, {tA:"Alemanha",tB:"Costa do Marfim"}, {tA:"Equador",tB:"Curaçao"}, {tA:"Tunísia",tB:"Japão"},
    {tA:"Espanha",tB:"Arábia Saudita"}, {tA:"Bélgica",tB:"Irã"}, {tA:"Uruguai",tB:"Cabo Verde"}, {tA:"Nova Zelândia",tB:"Egito"},
    {tA:"Argentina",tB:"Áustria"}, {tA:"França",tB:"Iraque"}, {tA:"Noruega",tB:"Senegal"}, {tA:"Jordânia",tB:"Argélia"},
    {tA:"Portugal",tB:"Uzbequistão"}, {tA:"Inglaterra",tB:"Gana"}, {tA:"Panamá",tB:"Croácia"}, {tA:"Colômbia",tB:"R. D. Congo"}
];
function renderizar() {
    let htmlR1 = "";
    estruturaJogos.forEach(t => { htmlR1 += `<div class="jogo-card"><div class="jogo-principal"><div class="time-container casa"><span>${t.tA}</span><span class="bandeira">${t.bA}</span></div><div class="placar-container"><div class="placar-wrapper"><div class="placar-box">${resultadosFinais[t.idA]}</div><span class="divisor">X</span><div class="placar-box">${resultadosFinais[t.idB]}</div></div></div><div class="time-container fora"><span class="bandeira">${t.bB}</span><span>${t.tB}</span></div></div></div>` });
    document.getElementById("lista-jogos-principal").innerHTML = htmlR1;
    let htmlR2 = "";
    r2.forEach(j => { htmlR2 += `<div class="jogo-card"><div class="jogo-principal" style="justify-content:center; gap:10px;"><span>${j.tA}</span><b>X</b><span>${j.tB}</span></div></div>` });
    document.getElementById("lista-r2").innerHTML = htmlR2;
}
function fecharPalpites() { document.getElementById("modal-palpites").classList.remove("ativo"); }
renderizar();
</script></body></html>
