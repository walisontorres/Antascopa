    <style>:root { --primary: #0f5132; --primary-dark: #082e1c; --accent: #ffc107; --bg: #f3f7f5; --surface: #ffffff; --text: #1c2421; --text-muted: #606f69; --border: rgba(15,81,50,0.08); --radius: 24px; --radius-sm: 14px; --shadow: 0 20px 40px rgba(15,81,50,0.04) } * { box-sizing: border-box; margin: 0; padding: 0 } body { font-family: 'Plus Jakarta Sans',sans-serif; background-color: var(--bg); color: var(--text); line-height: 1.6; padding-bottom: 80px } header { background: linear-gradient(135deg,var(--primary-dark) 0%,var(--primary) 100%); color: #fff; text-align: center; padding: 60px 20px 80px 20px; border-radius: 0 0 var(--radius) var(--radius); position: relative } header h1 { font-size: 2.6rem; font-weight: 700; letter-spacing: -1.5px; margin-bottom: 10px } header p { font-size: 1.1rem; opacity: .85; font-weight: 500; background: rgba(255,255,255,0.1); padding: 6px 16px; border-radius: 100px; display: inline-block } .container { max-width: 880px; margin: -40px auto 0 auto; padding: 0 16px; position: relative; z-index: 10 } .card { background: var(--surface); padding: 30px 20px; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 35px; border: 1px solid var(--border) } h2 { font-size: 1.5rem; font-weight: 700; color: var(--primary-dark); margin-bottom: 25px; letter-spacing: -0.5px } .table-container { overflow-x: auto } .ranking-table { width: 100%; border-collapse: collapse; text-align: left } .ranking-table th { background-color: rgba(15,81,50,0.04); color: var(--text-muted); font-weight: 600; padding: 18px; font-size: .9rem; text-transform: uppercase; letter-spacing: 1px; border-radius: var(--radius-sm) var(--radius-sm) 0 0 } .ranking-table td { padding: 18px; border-bottom: 1px solid var(--border); font-size: 1rem } .ranking-table tr:last-child td { border-bottom: none } .sem-dados { text-align: center; color: var(--text-muted); padding: 50px 18px!important; font-style: italic } .part-lista { display: flex; flex-direction: column; gap: 15px } .part-item { display: flex; align-items: center; padding: 20px 25px; background: rgba(15,81,50,0.02); border: 1px solid var(--border); border-radius: var(--radius-sm); justify-content: space-between; transition: all .3s ease } .part-item:hover { transform: scale(1.01); background: rgba(15,81,50,0.04) } .part-nome { font-weight: 700; font-size: 1.2rem; color: var(--primary-dark) } .btn-palpites { background: linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%); color: #fff; border: none; padding: 10px 22px; border-radius: 100px; font-weight: 600; cursor: pointer; font-family: inherit; font-size: .95rem; box-shadow: 0 10px 20px rgba(15,81,50,0.15); transition: all .3s ease } .btn-palpites:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(15,81,50,0.25) } .jogos-lista { display: flex; flex-direction: column; gap: 18px } .jogo-card { display: flex; flex-direction: column; padding: 16px 12px; background: var(--surface); border-radius: var(--radius-sm); border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.02); transition: all .3s ease; gap: 12px } .jogo-card:hover { transform: translateY(-4px); border-color: rgba(15,81,50,0.2); box-shadow: 0 20px 35px rgba(15,81,50,0.06) } .jogo-principal { display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 8px } .time-container { flex: 1; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 1rem; color: var(--text); min-width: 0 } .time-container span:not(.bandeira) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap } .time-container.casa { justify-content: flex-end; text-align: right } .time-container.fora { justify-content: flex-start; text-align: left } .bandeira { font-size: 1.4rem; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.06)); flex-shrink: 0 } .placar-container { display: flex; flex-direction: column; align-items: center; gap: 4px; flex-shrink: 0; width: 125px } .placar-wrapper { display: flex; align-items: center; gap: 6px } .placar-box { width: 38px; height: 38px; background: rgba(15,81,50,0.03); border: 2px solid var(--border); border-radius: 10px; text-align: center; font-size: 1.1rem; font-weight: 700; color: var(--primary-dark); display: flex; align-items: center; justify-content: center } .divisor { font-weight: 700; color: rgba(15,81,50,0.3); font-size: .85rem } .jogo-odds { font-size: .65rem; font-weight: 700; color: var(--text-muted); background: rgba(15,81,50,0.05); padding: 3px 8px; border-radius: 100px; letter-spacing: 0.2px; white-space: nowrap; text-align: center; width: 100% } .news-feed { display: flex; flex-direction: column; gap: 20px } .news-card { border-left: 4px solid var(--primary); padding: 5px 0 5px 18px; display: flex; flex-direction: column; gap: 6px } .news-tag { font-size: .75rem; font-weight: 700; text-transform: uppercase; color: var(--accent); letter-spacing: 1px; background: var(--primary-dark); padding: 2px 10px; border-radius: 100px; width: fit-content } .news-title { font-size: 1.15rem; font-weight: 700; color: var(--primary-dark); letter-spacing: -0.3px } .news-text { font-size: .95rem; color: var(--text-muted); text-align: justify } .evolucao-container { display: flex; flex-direction: column; gap: 12px } .evolucao-linha { display: flex; align-items: center; gap: 10px; font-size: 0.9rem } .evolucao-nome { font-weight: 700; width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap } .evolucao-barra-bg { flex: 1; background: rgba(15,81,50,0.05); height: 14px; border-radius: 100px; overflow: hidden; position: relative } .evolucao-barra-fill { background: linear-gradient(90deg,var(--primary) 0%,var(--primary-dark) 100%); height: 100%; border-radius: 100px; transition: width 0.5s ease } .evolucao-pts { font-weight: 700; color: var(--primary); width: 55px; text-align: right } .evolucao-tendencia { font-size: 0.75rem; width: 45px; text-align: right; font-weight: 600 } .subiu { color: #198754 } .desceu { color: #dc3545 } .manteve { color: var(--text-muted) } .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(8,46,28,0.4); backdrop-filter: blur(8px); z-index: 100; align-items: center; justify-content: center; padding: 16px } .modal.ativo { display: flex } .modal-conteudo { background: var(--surface); padding: 30px 16px; border-radius: var(--radius); max-width: 650px; width: 100%; box-shadow: 0 30px 60px rgba(8,46,28,0.15); position: relative; animation: modalShow .4s cubic-bezier(0.34,1.56,0.64,1); max-height: 85vh; overflow-y: auto; border: 1px solid rgba(255,255,255,0.8) } .modal-fechar { position: absolute; top: 20px; right: 16px; background: rgba(15,81,50,0.05); border: none; font-size: 1.3rem; cursor: pointer; color: var(--primary-dark); width: 32px; height: 32px; border-radius: 100px; display: flex; align-items: center; justify-content: center; transition: all .2s } .modal-fechar:hover { background: rgba(15,81,50,0.1); transform: rotate(90deg) } .tab-container { display: flex; gap: 10px; margin-bottom: 15px; } .tab-btn { padding: 8px 16px; cursor: pointer; border-radius: 20px; border: 1px solid var(--primary); background: transparent; font-weight: 600; color: var(--primary); transition: 0.3s; } .tab-btn.active { background: var(--primary); color: #fff; } @keyframes modalShow { from { opacity: 0; transform: translateY(30px) } to { opacity: 1; transform: translateY(0) } } @media (max-width:480px) { header h1 { font-size: 2rem } .time-container { font-size: 0.82rem; gap: 4px } .bandeira { font-size: 1.2rem } .placar-box { width: 32px; height: 32px; font-size: 1rem; border-radius: 8px } .placar-container { width: 110px } .jogo-card { padding: 10px 4px; gap: 8px } .jogo-odds { font-size: .56rem; padding: 2px 4px } }</style>

<body>
<header><h1>Bolão Copa do Mundo</h1><p>Grupo Oficial: Os Antas 🐗</p></header>
<div class="container">
    <div class="card"><h2>Classificação Geral</h2><div class="table-container"><table class="ranking-table"><thead><tr><th style="width:100px">Posição</th><th>Participante</th><th style="width:140px;text-align:center">Points</th></tr></thead><tbody id="tabela-ranking"><tr><td colspan="3" class="sem-dados">Calculando...</td></tr></tbody></table></div></div>

    <div class="card"><h2>Lista de Participantes</h2><div class="part-lista" id="lista-participantes"></div></div>

<script>
const dadosPalpites = {
    "Wic": { "r2_j1_a": "2", "r2_j1_b": "0", "r2_j2_a": "1", "r2_j2_b": "1", "r2_j3_a": "1", "r2_j3_b": "1", "r2_j4_a": "1", "r2_j4_b": "2", "r2_j5_a": "3", "r2_j5_b": "0", "r2_j6_a": "0", "r2_j6_b": "2", "r2_j7_a": "2", "r2_j7_b": "0", "r2_j8_a": "2", "r2_j8_b": "0", "r2_j9_a": "3", "r2_j9_b": "1", "r2_j10_a": "1", "r2_j10_b": "1", "r2_j11_a": "4", "r2_j11_b": "0", "r2_j12_a": "1", "r2_j12_b": "2", "r2_j13_a": "3", "r2_j13_b": "0", "r2_j14_a": "2", "r2_j14_b": "1", "r2_j15_a": "2", "r2_j15_b": "0", "r2_j16_a": "0", "r2_j16_b": "1", "r2_j17_a": "2", "r2_j17_b": "29", "r2_j18_a": "3", "r2_j18_b": "1", "r2_j19_a": "3", "r2_j19_b": "1", "r2_j20_a": "0", "r2_j20_b": "0", "r2_j21_a": "3", "r2_j21_b": "0", "r2_j22_a": "3", "r2_j22_b": "1", "r2_j23_a": "0", "r2_j23_b": "2", "r2_j24_a": "1", "r2_j24_b": "0" }
};
const resultadosFinais={};
const jogosR1=[];
const jogosR2=[{tA:"Rep. Tcheca",bA:"🇨🇿",tB:"África do Sul",bB:"🇿🇦",idA:"r2_j1_a",idB:"r2_j1_b",o:"2.00 - 3.30 - 3.60"},{tA:"Suíça",bA:"🇨🇭",tB:"Bósnia",bB:"🇧🇦",idA:"r2_j2_a",idB:"r2_j2_b",o:"1.70 - 3.60 - 4.80"},{tA:"Canadá",bA:"🇨🇦",tB:"Catar",bB:"🇶🇦",idA:"r2_j3_a",idB:"r2_j3_b",o:"1.90 - 3.40 - 4.00"},{tA:"México",bA:"🇲🇽",tB:"Coreia do Sul",bB:"🇰🇷",idA:"r2_j4_a",idB:"r2_j4_b",o:"1.85 - 3.50 - 4.00"},{tA:"EUA",bA:"🇺🇸",tB:"Austrália",bB:"🇦🇺",idA:"r2_j5_a",idB:"r2_j5_b",o:"1.75 - 3.60 - 4.40"},{tA:"Escócia",bA:"🏴󠁧󠁢󠁳󠁣󠁴󠁿",tB:"Marrocos",bB:"🇲🇦",idA:"r2_j6_a",idB:"r2_j6_b",o:"2.30 - 3.20 - 3.10"},{tA:"Brasil",bA:"🇧🇷",tB:"Haiti",bB:"🇭🇹",idA:"r2_j7_a",idB:"r2_j7_b",o:"1.15 - 7.00 - 15.0"},{tA:"Turquia",bA:"🇹🇷",tB:"Paraguai",bB:"🇵🇾",idA:"r2_j8_a",idB:"r2_j8_b",o:"1.95 - 3.40 - 3.80"},{tA:"Países Baixos",bA:"🇳🇱",tB:"Suécia",bB:"🇸🇪",idA:"r2_j9_a",idB:"r2_j9_b",o:"2.10 - 3.30 - 3.40"},{tA:"Alemanha",bA:"🇩🇪",tB:"Costa do Marfim",bB:"🇨🇮",idA:"r2_j10_a",idB:"r2_j10_b",o:"1.30 - 5.00 - 9.00"},{tA:"Equador",bA:"🇪🇨",tB:"Curaçao",bB:"🇨🇼",idA:"r2_j11_a",idB:"r2_j11_b",o:"1.50 - 4.00 - 6.00"},{tA:"Tunísia",bA:"🇱🇳",tB:"Japão",bB:"🇯🇵",idA:"r2_j12_a",idB:"r2_j12_b",o:"2.80 - 3.20 - 2.50"},{tA:"Espanha",bA:"🇪🇸",tB:"Arábia Saudita",bB:"🇸🇦",idA:"r2_j13_a",idB:"r2_j13_b",o:"1.40 - 4.50 - 7.50"},{tA:"Bélgica",bA:"🇧🇪",tB:"Irã",bB:"🇮🇷",idA:"r2_j14_a",idB:"r2_j14_b",o:"1.55 - 4.00 - 5.50"},{tA:"Uruguai",bA:"🇺🇾",tB:"Cabo Verde",bB:"🇨🇻",idA:"r2_j15_a",idB:"r2_j15_b",o:"1.60 - 3.80 - 5.00"},{tA:"Nova Zelândia",bA:"🇳🇿",tB:"Egito",bB:"🇪🇬",idA:"r2_j16_a",idB:"r2_j16_b",o:"2.50 - 3.20 - 2.80"},{tA:"Argentina",bA:"🇦🇷",tB:"Áustria",bB:"🇦🇹",idA:"r2_j17_a",idB:"r2_j17_b",o:"1.70 - 3.60 - 4.80"},{tA:"França",bA:"🇫🇷",tB:"Iraque",bB:"🇮🇶",idA:"r2_j18_a",idB:"r2_j18_b",o:"1.35 - 4.80 - 8.00"},{tA:"Noruega",bA:"🇳🇴",tB:"Senegal",bB:"🇸🇳",idA:"r2_j19_a",idB:"r2_j19_b",o:"1.90 - 3.50 - 3.80"},{tA:"Jordânia",bA:"🇯🇴",tB:"Argélia",bB:"🇩🇿",idA:"r2_j20_a",idB:"r2_j20_b",o:"3.00 - 3.30 - 2.30"},{tA:"Portugal",bA:"🇵🇹",tB:"Uzbequistão",bB:"🇺🇿",idA:"r2_j21_a",idB:"r2_j21_b",o:"1.20 - 6.00 - 12.0"},{tA:"Inglaterra",bA:"🏴󠁧󠁢󠁥󠁮󠁧󠁿",tB:"Gana",bB:"🇬🇭",idA:"r2_j22_a",idB:"r2_j22_b",o:"1.45 - 4.20 - 7.00"},{tA:"Panamá",bA:"🇵🇦",tB:"Croácia",bB:"🇭🇷",idA:"r2_j23_a",idB:"r2_j23_b",o:"4.50 - 3.50 - 1.80"},{tA:"Colômbia",bA:"🇨🇴",tB:"R. D. Congo",bB:"🇨🇩",idA:"r2_j24_a",idB:"r2_j24_b",o:"1.50 - 4.00 - 6.50"}];
let rodadaAtual = 1;
function renderizarPorRodada(n){rodadaAtual=n;document.getElementById('btnR1').className=n===1?'tab-btn active':'tab-btn';document.getElementById('btnR2').className=n===2?'tab-btn active':'tab-btn';renderizarJogos();}
function renderizarJogos(){const container=document.getElementById("lista-jogos-principal");const jogos=rodadaAtual===1?jogosR1:jogosR2;let html="";jogos.forEach(t=>{const resA=resultadosFinais[t.idA]||"-";const resB=resultadosFinais[t.idB]||"-";html+=`<div class="jogo-card"><div class="jogo-principal"><div class="time-container casa"><span>${t.tA}</span><span class="bandeira">${t.bA}</span></div><div class="placar-container"><div class="placar-wrapper"><div class="placar-box">${resA}</div><span class="divisor">X</span><div class="placar-box">${resB}</div></div></div><div class="time-container fora"><span class="bandeira">${t.bB}</span><span>${t.tB}</span></div></div><div class="jogo-odds">ODDS: ${t.o}</div></div>`});container.innerHTML=html}
function abrirPalpites(e, rodada=2) {
    document.getElementById("modal-titulo").innerText = `Palpites de ${e}`;
    const t = dadosPalpites[e];
    const jogos = rodada === 1 ? jogosR1 : jogosR2;
    let html = `<div class="jogos-lista">`;
    jogos.forEach((jogo) => {
        const pA = t[jogo.idA] || "-";
        const pB = t[jogo.idB] || "-";
        html += `
        <div class="jogo-card">
            <div class="jogo-principal">
                <div class="time-container casa"><span>${jogo.tA}</span><span class="bandeira">${jogo.bA}</span></div>
                <div class="placar-container">
                    <div class="placar-wrapper">
                        <div class="placar-box">${pA}</div>
                        <span class="divisor">X</span>
                        <div class="placar-box">${pB}</div>
                    </div>
                </div>
                <div class="time-container fora"><span class="bandeira">${jogo.bB}</span><span>${jogo.tB}</span></div>
            </div>
        </div>`;
    });
    html += `</div>`;
    document.getElementById("modal-container-interno").innerHTML = html;
    document.getElementById("modal-palpites").classList.add("ativo");
}
function fecharPalpites(){document.getElementById("modal-palpites").classList.remove("ativo")}function fecharModalExterno(e){"modal-palpites"===e.target.id&&fecharPalpites()}
function atualizarClassificacao(){let p="";Object.keys(dadosPalpites).forEach(n=>{p+=`<div class="part-item"><span class="part-nome">${n}</span><button class="btn-palpites" onclick="abrirPalpites('${n}')">Ver Palpites</button></div>`});document.getElementById("lista-participantes").innerHTML=p}
renderizarPorRodada(2);atualizarClassificacao();</script></body></html>
