<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bolão Copa do Mundo - Antas</title><style>:root { --primary: #0f5132; --primary-dark: #082e1c; --accent: #ffc107; --bg: #f3f7f5; --surface: #ffffff; --text: #1c2421; --text-muted: #606f69; --border: rgba(15,81,50,0.08); --radius: 24px; --radius-sm: 14px; --shadow: 0 20px 40px rgba(15,81,50,0.04) } * { box-sizing: border-box; margin: 0; padding: 0 } body { font-family: 'Plus Jakarta Sans',sans-serif; background-color: var(--bg); color: var(--text); padding-bottom: 80px } header { background: linear-gradient(135deg,var(--primary-dark) 0%,var(--primary) 100%); color: #fff; text-align: center; padding: 40px 20px; border-radius: 0 0 var(--radius) var(--radius) } .container { max-width: 880px; margin: 20px auto; padding: 0 16px } .tabs { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center } .tab-btn { padding: 10px 25px; border: none; border-radius: 100px; cursor: pointer; background: #e0e0e0; font-weight: 700; transition: .3s } .tab-btn.active { background: var(--primary); color: white } .card { background: var(--surface); padding: 30px 20px; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 35px; border: 1px solid var(--border) } h2 { font-size: 1.5rem; font-weight: 700; color: var(--primary-dark); margin-bottom: 25px } .ranking-table { width: 100%; border-collapse: collapse } .ranking-table td { padding: 15px; border-bottom: 1px solid var(--border) } .jogo-card { display: flex; flex-direction: column; padding: 16px; background: #fafafa; border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 12px } .jogo-principal { display: flex; align-items: center; justify-content: space-between } .placar-box { width: 35px; height: 35px; background: #fff; border: 2px solid var(--primary); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700 } .part-item { display: flex; justify-content: space-between; padding: 15px; background: rgba(15,81,50,0.03); margin-bottom: 8px; border-radius: 10px } </style></head><body>
<header><h1>Bolão Copa do Mundo</h1><p>Grupo Oficial: Os Antas 🐗</p></header>
<div class="container">
    <div class="tabs">
        <button id="btn-r1" class="tab-btn active" onclick="renderizarConteudo(1)">Rodada 1</button>
        <button id="btn-r2" class="tab-btn" onclick="renderizarConteudo(2)">Rodada 2</button>
    </div>

    <div id="view-ranking">
        <div class="card"><h2>Classificação Geral</h2><table class="ranking-table" id="tabela-ranking"></table></div>
        <div class="card"><h2>Evolução 📈</h2><div id="painel-evolucao"></div></div>
    </div>

    <div class="card"><h2>Jogos</h2><div id="lista-jogos"></div></div>
    <div class="card"><h2>Participantes</h2><div id="lista-participantes"></div></div>
</div>

<script>
// Mantenha suas constantes de dados (dadosPalpites e resultadosFinais) aqui
const participantes = ["Walishow", "Paulão", "Campeão de 2026 Okc Freitas", "Fish", "Psico", "Sid", "Lucas", "Gu", "Wix", "Julian", "soltin", "Samuel", "Abner"];
const rodadas = {
    1: [{tA:"México", bA:"🇲🇽", tB:"África do Sul", bB:"🇿🇦", idA:"j1_a", idB:"j1_b"}, /* ... restante da rodada 1 ... */],
    2: [{tA:"Rep. Tcheca", bA:"🇨🇿", tB:"África do Sul", bB:"🇿🇦", idA:"r2_j1_a", idB:"r2_j1_b"}, /* ... restante da rodada 2 ... */]
};

function renderizarConteudo(n) {
    document.getElementById('btn-r1').classList.toggle('active', n === 1);
    document.getElementById('btn-r2').classList.toggle('active', n === 2);
    
    // Renderiza Jogos
    const container = document.getElementById("lista-jogos");
    container.innerHTML = "";
    rodadas[n].forEach(j => {
        container.innerHTML += `
            <div class="jogo-card">
                <div class="jogo-principal">
                    <div>${j.tA} ${j.bA}</div>
                    <div class="placar-box">-</div> X <div class="placar-box">-</div>
                    <div>${j.bB} ${j.tB}</div>
                </div>
            </div>`;
    });
}

// Inicializar
renderizarConteudo(1);
// (Aqui você pode incluir suas funções de cálculo de ranking que já existiam)
</script></body></html>
