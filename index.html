<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Bolão Copa do Mundo - Antas</title>
    <style>
        :root { 
            --primary: #0f5132; 
            --primary-dark: #082e1c; 
            --accent: #ffc107; 
            --bg: #f3f7f5; 
            --surface: #ffffff; 
            --text: #1c2421; 
            --text-muted: #606f69; 
            --border: rgba(15,81,50,0.08); 
            --radius: 24px; 
            --radius-sm: 14px; 
            --shadow: 0 20px 40px rgba(15,81,50,0.04) 
        } 
        * { box-sizing: border-box; margin: 0; padding: 0 } 
        body { font-family: 'Plus Jakarta Sans',sans-serif; background-color: var(--bg); color: var(--text); line-height: 1.6; padding-bottom: 80px } 
        header { background: linear-gradient(135deg,var(--primary-dark) 0%,var(--primary) 100%); color: #fff; text-align: center; padding: 60px 20px 80px 20px; border-radius: 0 0 var(--radius) var(--radius); position: relative } 
        header h1 { font-size: 2.6rem; font-weight: 700; letter-spacing: -1.5px; margin-bottom: 10px } 
        header p { font-size: 1.1rem; opacity: .85; font-weight: 500; background: rgba(255,255,255,0.1); padding: 6px 16px; border-radius: 100px; display: inline-block } 
        .container { max-width: 880px; margin: -40px auto 0 auto; padding: 0 16px; position: relative; z-index: 10 } 
        .card { background: var(--surface); padding: 30px 20px; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 35px; border: 1px solid var(--border) } 
        h2 { font-size: 1.5rem; font-weight: 700; color: var(--primary-dark); margin-bottom: 25px; letter-spacing: -0.5px } 
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px } 
        .stat-card { background: rgba(15,81,50,0.03); padding: 20px; border-radius: var(--radius-sm); text-align: center; border: 1px solid var(--border) } 
        .stat-value { font-size: 1.8rem; font-weight: 800; color: var(--primary); display: block } 
        .stat-label { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600 } 
        .table-container { overflow-x: auto } 
        .ranking-table { width: 100%; border-collapse: collapse; text-align: left } 
        .ranking-table th { background-color: rgba(15,81,50,0.04); color: var(--text-muted); font-weight: 600; padding: 18px; font-size: .9rem; text-transform: uppercase; letter-spacing: 1px; border-radius: var(--radius-sm) var(--radius-sm) 0 0 } 
        .ranking-table td { padding: 18px; border-bottom: 1px solid var(--border); font-size: 1rem } 
        .ranking-table tr:last-child td { border-bottom: none } 
        .sem-dados { text-align: center; color: var(--text-muted); padding: 50px 18px!important; font-style: italic } 
        .part-lista { display: flex; flex-direction: column; gap: 15px } 
        .part-item { display: flex; align-items: center; padding: 20px 25px; background: rgba(15,81,50,0.02); border: 1px solid var(--border); border-radius: var(--radius-sm); justify-content: space-between; transition: all .3s ease } 
        .part-item:hover { transform: scale(1.01); background: rgba(15,81,50,0.04) } 
        .part-nome { font-weight: 700; font-size: 1.2rem; color: var(--primary-dark) } 
        .btn-palpites { background: linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%); color: #fff; border: none; padding: 10px 22px; border-radius: 100px; font-weight: 600; cursor: pointer; font-family: inherit; font-size: .95rem; box-shadow: 0 10px 20px rgba(15,81,50,0.15); transition: all .3s ease } 
        .btn-palpites:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(15,81,50,0.25) } 
        .jogos-lista { display: flex; flex-direction: column; gap: 18px } 
        .jogo-card { display: flex; flex-direction: column; padding: 16px 12px; background: var(--surface); border-radius: var(--radius-sm); border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.02); transition: all .3s ease; gap: 12px } 
        .jogo-card:hover { transform: translateY(-4px); border-color: rgba(15,81,50,0.2); box-shadow: 0 20px 35px rgba(15,81,50,0.06) } 
        .jogo-principal { display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 8px } 
        .time-container { flex: 1; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 1rem; color: var(--text); min-width: 0 } 
        .time-container span:not(.bandeira) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap } 
        .time-container.casa { justify-content: flex-end; text-align: right } 
        .time-container.fora { justify-content: flex-start; text-align: left } 
        .bandeira { font-size: 1.4rem; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.06)); flex-shrink: 0 } 
        .placar-container { display: flex; flex-direction: column; align-items: center; gap: 4px; flex-shrink: 0; width: 125px } 
        .placar-wrapper { display: flex; align-items: center; gap: 6px } 
        .placar-box { width: 38px; height: 38px; background: rgba(15,81,50,0.03); border: 2px solid var(--border); border-radius: 10px; text-align: center; font-size: 1.1rem; font-weight: 700; color: var(--primary-dark); display: flex; align-items: center; justify-content: center } 
        .divisor { font-weight: 700; color: rgba(15,81,50,0.3); font-size: .85rem } 
        .jogo-odds { font-size: .7rem; font-weight: 700; color: var(--primary); background: rgba(15,81,50,0.08); padding: 4px 10px; border-radius: 100px; letter-spacing: 0.5px; white-space: nowrap; text-align: center; width: 100%; border: 1px solid var(--primary-dark) } 
        .news-feed { display: flex; flex-direction: column; gap: 20px } 
        .news-card { border-left: 4px solid var(--primary); padding: 5px 0 5px 18px; display: flex; flex-direction: column; gap: 6px } 
        .news-tag { font-size: .75rem; font-weight: 700; text-transform: uppercase; color: var(--accent); letter-spacing: 1px; background: var(--primary-dark); padding: 2px 10px; border-radius: 100px; width: fit-content } 
        .news-title { font-size: 1.15rem; font-weight: 700; color: var(--primary-dark); letter-spacing: -0.3px } 
        .news-text { font-size: .95rem; color: var(--text-muted); text-align: justify } 
        .evolucao-container { display: flex; flex-direction: column; gap: 12px } 
        .evolucao-linha { display: flex; align-items: center; gap: 10px; font-size: 0.9rem } 
        .evolucao-nome { font-weight: 700; width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap } 
        .evolucao-barra-bg { flex: 1; background: rgba(15,81,50,0.05); height: 14px; border-radius: 100px; overflow: hidden; position: relative } 
        .evolucao-barra-fill { background: linear-gradient(90deg,var(--primary) 0%,var(--primary-dark) 100%); height: 100%; border-radius: 100px; transition: width 0.5s ease } 
        .evolucao-pts { font-weight: 700; color: var(--primary); width: 55px; text-align: right } 
        .evolucao-tendencia { font-size: 0.75rem; width: 45px; text-align: right; font-weight: 600 } 
        .subiu { color: #198754 } .desceu { color: #dc3545 } .manteve { color: var(--text-muted) } 
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(8,46,28,0.4); backdrop-filter: blur(8px); z-index: 100; align-items: center; justify-content: center; padding: 16px } 
        .modal.ativo { display: flex } 
        .modal-conteudo { background: var(--surface); padding: 30px 16px; border-radius: var(--radius); max-width: 650px; width: 100%; box-shadow: 0 30px 60px rgba(8,46,28,0.15); position: relative; animation: modalShow .4s cubic-bezier(0.34,1.56,0.64,1); max-height: 85vh; overflow-y: auto; border: 1px solid rgba(255,255,255,0.8) } 
        .modal-fechar { position: absolute; top: 20px; right: 16px; background: rgba(15,81,50,0.05); border: none; font-size: 1.3rem; cursor: pointer; color: var(--primary-dark); width: 32px; height: 32px; border-radius: 100px; display: flex; align-items: center; justify-content: center; transition: all .2s } 
        .modal-fechar:hover { background: rgba(15,81,50,0.1); transform: rotate(90deg) } 
        .tab-container { display: flex; gap: 10px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; } 
        .tab-btn { padding: 8px 16px; cursor: pointer; border-radius: 20px; border: 1px solid var(--primary); background: transparent; font-weight: 600; color: var(--primary); transition: 0.3s; white-space: nowrap; } 
        .tab-btn.active { background: var(--primary); color: #fff; } 
        
        @keyframes modalShow { from { opacity: 0; transform: translateY(30px) } to { opacity: 1; transform: translateY(0) } } 
        
        @media (max-width:480px) { 
            header h1 { font-size: 2rem } 
            .time-container { font-size: 0.82rem; gap: 4px } 
            .bandeira { font-size: 1.2rem } 
            .placar-box { width: 32px; height: 32px; font-size: 1rem; border-radius: 8px } 
            .placar-container { width: 110px } 
            .jogo-card { padding: 10px 4px; gap: 8px } 
            .jogo-odds { font-size: .56rem; padding: 2px 4px } 
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<header>
    <h1>Bolão Copa do Mundo</h1>
    <p>Grupo Oficial: Os Antas 🐗</p>
</header>
<div class="container">
    <div class="card">
        <h2>Classificação Geral</h2>
        <div class="stats-grid" id="stats-container"></div>
        <div class="table-container">
            <table class="ranking-table">
                <thead>
                    <tr>
                        <th style="width:100px">Posição</th>
                        <th>Participante</th>
                        <th style="width:140px;text-align:center">Points</th>
                    </tr>
                </thead>
                <tbody id="tabela-ranking">
                    <tr><td colspan="3" class="sem-dados">Calculando...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <div class="card">
        <h2>Estatísticas Avançadas 🏆</h2>
        <div id="estatisticas-dinamicas"></div>
    </div>
    
    <div class="card">
        <h2>Painel de Evolução do Grupo 📈</h2>
        <div class="evolucao-container" id="painel-evolucao"></div>
    </div>
    
    <div class="card">
        <h2>Lista de Participantes</h2>
        <div class="part-lista" id="lista-participantes"></div>
    </div>
    
    <div class="card">
        <div class="tab-container" id="tab-container-jogos">
            <button class="tab-btn active" id="btnR1" onclick="renderizarPorRodada(1)">Rodada 1</button>
            <button class="tab-btn" id="btnR2" onclick="renderizarPorRodada(2)">Rodada 2</button>
            <button class="tab-btn" id="btnR3" onclick="renderizarPorRodada(3)">Rodada 3</button>
        </div>
        <h2>Jogos & Resultados</h2>
        <div class="jogos-lista" id="lista-jogos-principal"></div>
    </div>
    
    <div class="card">
        <h2>Últimas Notícias do Front 📰</h2>
        <div class="news-feed" id="news-container"></div>
    </div>
</div>

<div id="modal-palpites" class="modal" onclick="fecharModalExterno(event)">
    <div class="modal-conteudo">
        <button class="modal-fechar" onclick="fecharPalpites()">&times;</button>
        <h2 id="modal-titulo">Palpites</h2>
        <div id="modal-container-interno"></div>
    </div>
</div>

<script>
// DADOS DOS PARTICIPANTES E PALPITES
// Você pode preencher os palpites corretos da sua base de dados aqui dentro de cada chave.
const dadosPalpites = { 
    "Walishow": {}, 
    "Paulão": {}, 
    "Gu": {}, 
    "Campeão de 2026 Okc Freitas": {}, 
    "Fish": {}, 
    "Psico": {}, 
    "Sid": {}, 
    "Lucas": {}, 
    "Wix": {}, 
    "Julian": {}, 
    "soltin": {}, 
    "Samuel": {}, 
    "Abner": {} 
};

// DADOS DOS RESULTADOS REAIS (Preencha com o ID do jogo e os placares)
const resultadosFinais = {
    // Exemplo: 'r1j1': {casa: 2, fora: 0}
};

// JOGOS DAS RODADAS (Exemplos prontos para você substituir pelos reais)
const jogosR1 = [
    { id: 'r1j1', timeA: 'Brasil', timeB: 'Sérvia', bandeiraA: '🇧🇷', bandeiraB: '🇷🇸', data: 'Exemplo: 24/11 - 16:00', oddA: 1.5, oddE: 3.5, oddB: 5.0 },
    { id: 'r1j2', timeA: 'Portugal', timeB: 'Gana', bandeiraA: '🇵🇹', bandeiraB: '🇬🇭', data: 'Exemplo: 24/11 - 13:00', oddA: 1.4, oddE: 4.0, oddB: 6.0 }
];

const jogosR2 = [
    { id: 'r2j1', timeA: 'Brasil', timeB: 'Suíça', bandeiraA: '🇧🇷', bandeiraB: '🇨🇭', data: 'Exemplo: 28/11 - 13:00', oddA: 1.6, oddE: 3.8, oddB: 5.2 },
    { id: 'r2j2', timeA: 'Portugal', timeB: 'Uruguai', bandeiraA: '🇵🇹', bandeiraB: '🇺🇾', data: 'Exemplo: 28/11 - 16:00', oddA: 2.0, oddE: 3.2, oddB: 3.8 }
];

const jogosR3 = [
    { id: 'r3j1', timeA: 'Camarões', timeB: 'Brasil', bandeiraA: '🇨🇲', bandeiraB: '🇧🇷', data: 'Exemplo: 02/12 - 16:00', oddA: 8.5, oddE: 4.5, oddB: 1.3 },
    { id: 'r3j2', timeA: 'Coreia do Sul', timeB: 'Portugal', bandeiraA: '🇰🇷', bandeiraB: '🇵🇹', data: 'Exemplo: 02/12 - 12:00', oddA: 4.0, oddE: 3.8, oddB: 1.7 }
];

let rodadaAtual = 1;

// SISTEMA DE CÁLCULO DE PONTOS
function calcularPontos(rA, rB, pA, pB) {
    if (isNaN(rA) || isNaN(rB) || isNaN(pA) || isNaN(pB)) return 0;
    if (rA === pA && rB === pB) return 10; // Placar exato
    if ((rA - rB) === (pA - pB) && ((rA > rB && pA > pB) || (rB > rA && pB > pA))) return 6; // Empate com gols diferentes ou Saldo exato
    if ((rA - rB) === 0 && (pA - pB) === 0) return 5; // Acertou empate, mas placar diferente
    if ((rA > rB && pA > pB) || (rB > rA && pB > pA)) return 3; // Acertou só o vencedor
    return 0; // Errou tudo
}

// LÓGICA DAS ABAS DE RODADAS
function renderizarPorRodada(n){
    rodadaAtual = n;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById(`btnR${n}`).classList.add('active');
    renderizarJogos();
}

// RENDERIZAR CARDS DOS JOGOS NA ABA SELECIONADA
function renderizarJogos(){
    const container = document.getElementById("lista-jogos-principal");
    let listaJogos = [];
    
    if (rodadaAtual === 1) listaJogos = jogosR1;
    else if (rodadaAtual === 2) listaJogos = jogosR2;
    else if (rodadaAtual === 3) listaJogos = jogosR3;

    if (listaJogos.length === 0) {
        container.innerHTML = '<p class="sem-dados">Jogos desta rodada ainda não cadastrados.</p>';
        return;
    }

    let html = '';
    listaJogos.forEach(jogo => {
        let placarRealA = "-";
        let placarRealB = "-";
        if (resultadosFinais[jogo.id]) {
            placarRealA = resultadosFinais[jogo.id].casa;
            placarRealB = resultadosFinais[jogo.id].fora;
        }

        html += `
            <div class="jogo-card">
                <div style="font-size: 0.8rem; color: var(--text-muted); text-align: center; font-weight: 600; margin-bottom: -4px;">
                    ${jogo.data}
                </div>
                <div class="jogo-principal">
                    <div class="time-container casa">
                        <span>${jogo.timeA}</span>
                        <span class="bandeira">${jogo.bandeiraA}</span>
                    </div>
                    <div class="placar-container">
                        <div class="placar-wrapper">
                            <div class="placar-box">${placarRealA}</div>
                            <span class="divisor">X</span>
                            <div class="placar-box">${placarRealB}</div>
                        </div>
                    </div>
                    <div class="time-container fora">
                        <span class="bandeira">${jogo.bandeiraB}</span>
                        <span>${jogo.timeB}</span>
                    </div>
                </div>
                <div class="jogo-odds">
                    1(${jogo.oddA}) | X(${jogo.oddE}) | 2(${jogo.oddB})
                </div>
                <button class="btn-palpites" style="margin-top: 8px;" onclick="abrirPalpites('${jogo.id}', '${jogo.timeA} vs ${jogo.timeB}')">
                    Ver Palpites
                </button>
            </div>
        `;
    });
    container.innerHTML = html;
}

// ATUALIZAR CLASSIFICAÇÃO (CALCULANDO R1 + R2 + R3)
function atualizarClassificacao(){
    const tabelaRanking = document.getElementById("tabela-ranking");
    const containerPart = document.getElementById("lista-participantes");
    const containerEvo = document.getElementById("painel-evolucao");
    const todosOsJogos = [...jogosR1, ...jogosR2, ...jogosR3];
    let ranking = [];

    // Calcula os pontos de cada participante
    for (let nome in dadosPalpites) {
        let pontosTotais = 0;
        let palpitesPessoa = dadosPalpites[nome];

        todosOsJogos.forEach(jogo => {
            if (resultadosFinais[jogo.id] && palpitesPessoa[jogo.id]) {
                let rA = resultadosFinais[jogo.id].casa;
                let rB = resultadosFinais[jogo.id].fora;
                let pA = palpitesPessoa[jogo.id].casa;
                let pB = palpitesPessoa[jogo.id].fora;
                pontosTotais += calcularPontos(rA, rB, pA, pB);
            }
        });

        ranking.push({ nome: nome, pontos: pontosTotais });
    }

    // Ordena o ranking do maior para o menor
    ranking.sort((a, b) => b.pontos - a.pontos);

    // Renderiza a Tabela
    let htmlTabela = '';
    let htmlPart = '';
    let htmlEvo = '';

    ranking.forEach((part, index) => {
        let medalha = '';
        if (index === 0) medalha = '🥇 ';
        if (index === 1) medalha = '🥈 ';
        if (index === 2) medalha = '🥉 ';

        htmlTabela += `
            <tr>
                <td><strong>${index + 1}º</strong></td>
                <td>${medalha}${part.nome}</td>
                <td style="text-align:center"><strong>${part.pontos}</strong></td>
            </tr>
        `;

        htmlPart += `
            <div class="part-item">
                <span class="part-nome">${medalha}${part.nome}</span>
                <span style="font-weight:700; color:var(--primary)">${part.pontos} pts</span>
            </div>
        `;

        // Simulando tendência visual para o painel de evolução
        let maxPts = ranking[0].pontos === 0 ? 1 : ranking[0].pontos;
        let widthPct = (part.pontos / maxPts) * 100;
        
        htmlEvo += `
            <div class="evolucao-linha">
                <div class="evolucao-nome">${part.nome}</div>
                <div class="evolucao-barra-bg">
                    <div class="evolucao-barra-fill" style="width: ${widthPct}%"></div>
                </div>
                <div class="evolucao-pts">${part.pontos}</div>
            </div>
        `;
    });

    tabelaRanking.innerHTML = htmlTabela;
    containerPart.innerHTML = htmlPart;
    containerEvo.innerHTML = htmlEvo;

    // Estatísticas Dinâmicas Simples
    document.getElementById("estatisticas-dinamicas").innerHTML = `
        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-value">${ranking[0].nome}</span>
                <span class="stat-label">Líder Atual</span>
            </div>
            <div class="stat-card">
                <span class="stat-value">${ranking[ranking.length - 1].nome}</span>
                <span class="stat-label">Lanterna</span>
            </div>
        </div>
    `;
    
    // Sumário Rápido
    document.getElementById("stats-container").innerHTML = `
        <div class="stat-card">
            <span class="stat-value">${Object.keys(dadosPalpites).length}</span>
            <span class="stat-label">Participantes</span>
        </div>
        <div class="stat-card">
            <span class="stat-value">${todosOsJogos.length}</span>
            <span class="stat-label">Jogos Previstos</span>
        </div>
    `;
}

// SISTEMA DE NOTÍCIAS FALSAS/DIVERTIDAS
function renderizarNoticias() {
    const news = [
        { tag: 'BOMBA', titulo: 'Alguém esqueceu de preencher a R3?', texto: 'Rumores apontam que alguns participantes estão apostando tudo na R3 para sair do fundo da tabela.' },
        { tag: 'ANÁLISE', titulo: 'O segredo dos líderes', texto: 'A estratégia parece ser clara: apostar nos empates chatos da fase de grupos tem rendido pontos valiosos.' }
    ];
    let html = '';
    news.forEach(n => {
        html += `
            <div class="news-card">
                <span class="news-tag">${n.tag}</span>
                <div class="news-title">${n.titulo}</div>
                <div class="news-text">${n.texto}</div>
            </div>
        `;
    });
    document.getElementById("news-container").innerHTML = html;
}

// MODAL DE PALPITES
function abrirPalpites(idJogo, tituloJogo) {
    document.getElementById('modal-titulo').innerText = "Palpites: " + tituloJogo;
    let html = '<div style="display:flex;flex-direction:column;gap:10px;">';
    
    let temPalpite = false;
    for (let nome in dadosPalpites) {
        if (dadosPalpites[nome][idJogo]) {
            temPalpite = true;
            let palpite = dadosPalpites[nome][idJogo];
            html += `
                <div style="display:flex; justify-content:space-between; padding: 12px; background: rgba(15,81,50,0.03); border: 1px solid var(--border); border-radius: 8px;">
                    <span style="font-weight: 600;">${nome}</span>
                    <strong style="color: var(--primary);">${palpite.casa} x ${palpite.fora}</strong>
                </div>
            `;
        }
    }
    
    if (!temPalpite) {
        html += '<p class="sem-dados">Ninguém palpitou neste jogo ainda.</p>';
    }
    
    html += '</div>';
    document.getElementById('modal-container-interno').innerHTML = html;
    document.getElementById('modal-palpites').classList.add('ativo');
    document.body.style.overflow = 'hidden';
}

function fecharPalpites() {
    document.getElementById('modal-palpites').classList.remove('ativo');
    document.body.style.overflow = 'auto';
}

function fecharModalExterno(event) {
    if (event.target.id === 'modal-palpites') {
        fecharPalpites();
    }
}
