<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolão Copa do Mundo - Antas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            color: #333;
        }
        header {
            background-color: #006633;
            color: white;
            text-align: center;
            padding: 20px 0;
        }
        header h1 {
            margin: 0;
            font-size: 2.5rem;
        }
        header p {
            margin: 5px 0 0 0;
            font-size: 1.1rem;
            color: #ffcc00;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            color: #006633;
            border-bottom: 2px solid #ffcc00;
            padding-bottom: 5px;
        }
        .ranking-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }
        .ranking-table th, .ranking-table td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }
        .ranking-table th {
            background-color: #006633;
            color: white;
        }
        .ranking-table tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .jogo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid #eee;
            border-radius: 5px;
            background-color: #fafafa;
        }
        .time {
            flex: 1;
            text-align: center;
            font-weight: bold;
        }
        .placar {
            width: 50px;
            text-align: center;
            font-size: 1.2rem;
            padding: 5px;
            margin: 0 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .vs {
            margin: 0 10px;
            font-style: italic;
            color: #777;
        }
        .btn-salvar {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #006633;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.2rem;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .btn-salvar:hover {
            background-color: #004d26;
        }
    </style>
</head>
<body>

    <header>
        <h1>Bolão Copa do Mundo</h1>
        <p>Grupo Oficial: Os Antas 🐗</p>
    </header>

    <div class="container">
        <h2>Classificação Geral - Antas</h2>
        <table class="ranking-table">
            <thead>
                <tr>
                    <th>Posição</th>
                    <th>Participante</th>
                    <th>Pontos</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1º</td>
                    <td>Walison</td>
                    <td>15 pts</td>
                </tr>
                <tr>
                    <td>2º</td>
                    <td>Nicolas</td>
                    <td>12 pts</td>
                </tr>
                <tr>
                    <td>3º</td>
                    <td>Luigi</td>
                    <td>10 pts</td>
                </tr>
                <tr>
                    <td>4º</td>
                    <td>Você</td>
                    <td>0 pts (Aguardando atualização)</td>
                </tr>
            </tbody>
        </table>

        <h2>Seus Palpites</h2>
        <form id="form-bolao">
            <div class="jogo">
                <div class="time">Brasil 🇧🇷</div>
                <input type="number" id="jogo1_timeA" class="placar" min="0">
                <span class="vs">X</span>
                <input type="number" id="jogo1_timeB" class="placar" min="0">
                <div class="time">França 🇫🇷</div>
            </div>

            <div class="jogo">
                <div class="time">Argentina 🇦🇷</div>
                <input type="number" id="jogo2_timeA" class="placar" min="0">
                <span class="vs">X</span>
                <input type="number" id="jogo2_timeB" class="placar" min="0">
                <div class="time">Alemanha 🇩🇪</div>
            </div>

            <div class="jogo">
                <div class="time">Portugal 🇵🇹</div>
                <input type="number" id="jogo3_timeA" class="placar" min="0">
                <span class="vs">X</span>
                <input type="number" id="jogo3_timeB" class="placar" min="0">
                <div class="time">Espanha 🇪🇸</div>
            </div>

            <button type="submit" class="btn-salvar">Salvar Meus Palpites</button>
        </form>
    </div>

    <script>
        // Elemento do formulário
        const form = document.getElementById('form-bolao');

        // Função para carregar palpites salvos no LocalStorage
        function carregarPalpites() {
            const palpitesSalvos = JSON.parse(localStorage.getItem('palpites_antas'));
            if (palpitesSalvos) {
                document.getElementById('jogo1_timeA').value = palpitesSalvos.jogo1_timeA || '';
                document.getElementById('jogo1_timeB').value = palpitesSalvos.jogo1_timeB || '';
                document.getElementById('jogo2_timeA').value = palpitesSalvos.jogo2_timeA || '';
                document.getElementById('jogo2_timeB').value = palpitesSalvos.jogo2_timeB || '';
                document.getElementById('jogo3_timeA').value = palpitesSalvos.jogo3_timeA || '';
                document.getElementById('jogo3_timeB').value = palpitesSalvos.jogo3_timeB || '';
            }
        }

        // Evento de envio do formulário para salvar os dados
        form.addEventListener('submit', function(event) {
            event.preventDefault();

            const palpites = {
                jogo1_timeA: document.getElementById('jogo1_timeA').value,
                jogo1_timeB: document.getElementById('jogo1_timeB').value,
                jogo2_timeA: document.getElementById('jogo2_timeA').value,
                jogo2_timeB: document.getElementById('jogo2_timeB').value,
                jogo3_timeA: document.getElementById('jogo3_timeA').value,
                jogo3_timeB: document.getElementById('jogo3_timeB').value
            };

            localStorage.setItem('palpites_antas', JSON.stringify(palpites));
            alert('Palpites salvos com sucesso, Anta!');
        });

        // Executa ao carregar a página
        carregarPalpites();
    </script>
</body>
</html>
