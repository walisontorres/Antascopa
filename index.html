<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolão Copa do Mundo - Antas</title>
    <style>
        body { font-family: sans-serif; background: #f3f7f5; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 14px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-tab { padding: 8px 16px; cursor: pointer; border: none; background: #eee; border-radius: 20px; margin-right: 5px; }
        .btn-tab.ativo { background: #0f5132; color: white; }
        .jogos-lista { display: none; }
        .jogos-lista.ativo { display: block; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: center; }
        .modal.ativo { display: flex; }
        .modal-conteudo { background: white; padding: 20px; border-radius: 14px; width: 90%; max-height: 80vh; overflow-y: auto; position: relative; }
        .evolucao-linha { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .evolucao-barra-bg { flex: 1; height: 10px; background: #eee; border-radius: 5px; }
        .evolucao-barra-fill { height: 100%; background: #0f5132; border-radius: 5px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Classificação Geral</h2>
    <table style="width:100%"><thead><tr><th>Posição</th><th>Participante</th><th>Pontos</th></tr></thead><tbody id="tabela-ranking"></tbody></table>
</div>

<div class="card">
    <h2>Evolução</h2>
    <div id="painel-evolucao"></div>
</div>

<div class="card">
    <h2>Participantes</h2>
    <div id="lista-participantes"></div>
</div>

<div id="modal-palpites" class="modal">
    <div class="modal-conteudo">
        <button onclick="fecharPalpites()" style="float:right">Fechar</button>
        <h2 id="modal-titulo"></h2>
        <div id="modal-lista-jogos"></div>
    </div>
</div>

<script>
const dadosPalpites = { 
    "Psico": { 
        j1_a: "2", j1_b: "1", j1_a_r2: "1", j1_b_r2: "0", j2_a: "1", j2_b: "1", j2_a_r2: "1", j2_b_r2: "1", j3_a: "0", j3_b: "0", j3_a_r2: "2", j3_b_r2: "2", j4_a: "1", j4_b: "2", j4_a_r2: "2", j4_b_r2: "2", j5_a: "3", j5_b: "0", j5_a_r2: "3", j5_b_r2: "1", j6_a: "0", j6_b: "2", j6_a_r2: "1", j6_b_r2: "1", j7_a: "1", j7_b: "2", j7_a_r2: "3", j7_b_r2: "0", j8_a: "1", j8_b: "2", j8_a_r2: "1", j8_b_r2: "1", j9_a: "3", j9_b: "0", j9_a_r2: "1", j9_b_r2: "2", j10_a: "1", j10_b: "2", j10_a_r2: "2", j10_b_r2: "1", j11_a: "1", j11_b: "3", j11_a_r2: "3", j11_b_r2: "0", j12_a: "1", j12_b: "2", j12_a_r2: "1", j12_b_r2: "1", j13_a: "0", j13_b: "1", j13_a_r2: "1", j13_b_r2: "0", j14_a: "2", j14_b: "0", j14_a_r2: "2", j14_b_r2: "1", j15_a: "2", j15_b: "0", j15_a_r2: "1", j15_b_r2: "0", j16_a: "1", j16_b: "2", j16_a_r2: "1", j16_b_r2: "2", j17_a: "2", j17_b: "1", j17_a_r2: "1", j17_b_r2: "0", j18_a: "0", j18_b: "4", j18_a_r2: "3", j18_b_r2: "1", j19_a: "2", j19_b: "1", j19_a_r2: "2", j19_b_r2: "1", j20_a: "2", j20_b: "0", j20_a_r2: "1", j20_b_r2: "1", j21_a: "3", j21_b: "0", j21_a_r2: "2", j21_b_r2: "0", j22_a: "1", j22_b: "3", j22_a_r2: "1", j22_b_r2: "2", j23_a: "1", j23_b: "1", j23_a_r2: "1", j23_b_r2: "2", j24_a: "2", j24_b: "1", j24_a_r2: "3", j24_b_r2: "0" 
    }
    // Adicione outros participantes mantendo a mesma estrutura de chaves
};

const resR1 = { j1_a: "2", j1_b: "0", j2_a: "2", j2_b: "1", j3_a: "1", j3_b: "1", j4_a: "1", j4_b: "1", j5_a: "1", j5_b: "1", j6_a: "0", j6_b: "1", j7_a: "4", j7_b: "1", j8_a: "2", j8_b: "0", j9_a: "7", j9_b: "1", j10_a: "1", j10_b: "0", j11_a: "2", j11_b: "2", j12_a: "5", j12_b: "1", j13_a: "1", j13_b: "1", j14_a: "2", j14_b: "2", j15_a: "0", j15_b: "0", j16_a: "1", j16_b: "1", j17_a: "3", j17_b: "1", j18_a: "1", j18_b: "4", j19_a: "3", j19_b: "0" };
const resR2 = { /* Adicione os resultados da R2 aqui quando houver */ };

function calcPts(p, res, isR2 = false) {
    let pts = 0;
    for (let i = 1; i <= 24; i++) {
        let suf = isR2 ? "_r2" : "";
        let rA = parseInt(res["j"+i+"_a"]), rB = parseInt(res["j"+i+"_b"]);
        let pA = parseInt(p["j"+i+"_a"+suf]), pB = parseInt(p["j"+i+"_b"+suf]);
        if (isNaN(rA) || isNaN(pA)) continue;
        if (rA === pA && rB === pB) pts += 10;
        else if ((rA - rB) === (pA - pB)) pts += 6;
        else if ((rA > rB && pA > pB) || (rA < rB && pA < pB)) pts += 3;
    }
    return pts;
}

function abrirPalpites(nome) {
    let p = dadosPalpites[nome], html = "<h3>Rodada 1</h3>";
    for(let i=1; i<=24; i++) html += `<div>Jogo ${i}: ${p['j'+i+'_a']||'-'} x ${p['j'+i+'_b']||'-'}</div>`;
    html += "<h3>Rodada 2</h3>";
    for(let i=1; i<=24; i++) html += `<div>Jogo ${i}: ${p['j'+i+'_a_r2']||'-'} x ${p['j'+i+'_b_r2']||'-'}</div>`;
    document.getElementById("modal-lista-jogos").innerHTML = html;
    document.getElementById("modal-titulo").innerText = "Palpites de " + nome;
    document.getElementById("modal-palpites").classList.add("ativo");
}
function fecharPalpites() { document.getElementById("modal-palpites").classList.remove("ativo"); }

// Inicialização
let ranking = Object.keys(dadosPalpites).map(n => ({ nome: n, pts: calcPts(dadosPalpites[n], resR1) + calcPts(dadosPalpites[n], resR2, true) })).sort((a,b) => b.pts - a.pts);
ranking.forEach((r, i) => document.getElementById("tabela-ranking").innerHTML += `<tr><td>${i+1}º</td><td>${r.nome}</td><td>${r.pts}</td></tr>`);
ranking.forEach(r => document.getElementById("painel-evolucao").innerHTML += `<div class="evolucao-linha"><span>${r.nome}</span><div class="evolucao-barra-bg"><div class="evolucao-barra-fill" style="width:${Math.max(5, r.pts * 2)}%"></div></div></div>`);
Object.keys(dadosPalpites).forEach(n => document.getElementById("lista-participantes").innerHTML += `<button onclick="abrirPalpites('${n}')" style="margin:5px">${n}</button>`);
</script>
</body>
</html>
