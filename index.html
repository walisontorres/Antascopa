<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bolão Copa do Mundo - Antas</title><style>:root { --primary: #0f5132; --primary-dark: #082e1c; --accent: #ffc107; --bg: #f3f7f5; --surface: #ffffff; --text: #1c2421; --text-muted: #606f69; --border: rgba(15,81,50,0.08); --radius: 24px; --radius-sm: 14px; --shadow: 0 20px 40px rgba(15,81,50,0.04) } * { box-sizing: border-box; margin: 0; padding: 0 } body { font-family: 'Plus Jakarta Sans',sans-serif; background-color: var(--bg); color: var(--text); line-height: 1.6; padding-bottom: 80px } header { background: linear-gradient(135deg,var(--primary-dark) 0%,var(--primary) 100%); color: #fff; text-align: center; padding: 60px 20px 80px 20px; border-radius: 0 0 var(--radius) var(--radius); position: relative } .container { max-width: 880px; margin: -40px auto 0 auto; padding: 0 16px; z-index: 10 } .card { background: var(--surface); padding: 30px 20px; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 35px; border: 1px solid var(--border) } h2 { font-size: 1.5rem; font-weight: 700; color: var(--primary-dark); margin-bottom: 25px } .btn-tab { background: #eee; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; margin-right: 5px; font-weight: 600; color: var(--text-muted); } .btn-tab.ativo { background: var(--primary); color: white; } .jogos-lista { display: none; flex-direction: column; gap: 18px } .jogos-lista.ativo { display: flex } .jogo-card { display: flex; flex-direction: column; padding: 16px 12px; background: var(--surface); border-radius: var(--radius-sm); border: 1px solid var(--border); gap: 12px } .jogo-principal { display: flex; align-items: center; justify-content: space-between; gap: 8px } .placar-box { width: 38px; height: 38px; background: rgba(15,81,50,0.03); border: 2px solid var(--border); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 700; } .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(8,46,28,0.4); backdrop-filter: blur(8px); z-index: 100; align-items: center; justify-content: center; padding: 16px } .modal.ativo { display: flex } .modal-conteudo { background: var(--surface); padding: 30px 16px; border-radius: var(--radius); max-width: 650px; width: 100%; max-height: 85vh; overflow-y: auto } </style></head><body><header><h1>Bolão Copa do Mundo</h1><p>Grupo Oficial: Os Antas 🐗</p></header>
<div class="container">
    <div class="card"><h2>Jogos & Resultados</h2>
        <div style="margin-bottom: 20px;">
            <button class="btn-tab ativo" onclick="alternarRodada(1, this)">Rodada 1</button>
            <button class="btn-tab" onclick="alternarRodada(2, this)">Rodada 2</button>
        </div>
        <div class="jogos-lista ativo" id="lista-jogos-r1"></div>
        <div class="jogos-lista" id="lista-jogos-r2"></div>
    </div>
</div>
<div id="modal-palpites" class="modal"><div class="modal-conteudo">
    <button onclick="fecharPalpites()">Fechar</button>
    <h2 id="modal-titulo">Palpites</h2>
    <div style="margin-bottom: 15px;">
        <button class="btn-tab ativo" id="btn-m-r1" onclick="atualizarModalRodada(1)">R1</button>
        <button class="btn-tab" id="btn-m-r2" onclick="atualizarModalRodada(2)">R2</button>
    </div>
    <div id="modal-lista-jogos"></div>
</div></div>
<script>
const estruturaJogosR1 = [{ tA: "México", bA: "🇲🇽", tB: "África do Sul", bB: "🇿🇦", idA: "j1_a", idB: "j1_b" }, /* ... completar resto R1 ... */ ];

    { tA: "Rep. Tcheca", bA: "🇨🇿", tB: "África do Sul", bB: "🇿🇦", idA: "r2_j1a", idB: "r2_j1b" },
    { tA: "Suíça", bA: "🇨🇭", tB: "Bósnia", bB: "🇧🇦", idA: "r2_j2a", idB: "r2_j2b" },
    { tA: "Canadá", bA: "🇨🇦", tB: "Catar", bB: "🇶🇦", idA: "r2_j3a", idB: "r2_j3b" },
    { tA: "México", bA: "🇲🇽", tB: "Coreia do Sul", bB: "🇰🇷", idA: "r2_j4a", idB: "r2_j4b" },
    { tA: "EUA", bA: "🇺🇸", tB: "Austrália", bB: "🇦🇺", idA: "r2_j5a", idB: "r2_j5b" },
    { tA: "Escócia", bA: "🏴󠁧󠁢󠁳󠁣󠁴󠁿", tB: "Marrocos", bB: "🇲🇦", idA: "r2_j6a", idB: "r2_j6b" },
    { tA: "Brasil", bA: "🇧🇷", tB: "Haiti", bB: "🇭🇹", idA: "r2_j7a", idB: "r2_j7b" },
    { tA: "Turquia", bA: "🇹🇷", tB: "Paraguai", bB: "🇵🇾", idA: "r2_j8a", idB: "r2_j8b" },
    { tA: "Holanda", bA: "🇳🇱", tB: "Suécia", bB: "🇸🇪", idA: "r2_j9a", idB: "r2_j9b" },
    { tA: "Alemanha", bA: "🇩🇪", tB: "Costa do Marfim", bB: "🇨🇮", idA: "r2_j10a", idB: "r2_j10b" },
    { tA: "Equador", bA: "🇪🇨", tB: "Curaçao", bB: "🇨🇼", idA: "r2_j11a", idB: "r2_j11b" },
    { tA: "Tunísia", bA: "🇹🇳", tB: "Japão", bB: "🇯🇵", idA: "r2_j12a", idB: "r2_j12b" },
    { tA: "Espanha", bA: "🇪🇸", tB: "Arábia Saudita", bB: "🇸🇦", idA: "r2_j13a", idB: "r2_j13b" },
    { tA: "Bélgica", bA: "🇧🇪", tB: "Irã", bB: "🇮🇷", idA: "r2_j14a", idB: "r2_j14b" },
    { tA: "Uruguai", bA: "🇺🇾", tB: "Cabo Verde", bB: "🇨🇻", idA: "r2_j15a", idB: "r2_j15b" },
    { tA: "Nova Zelândia", bA: "🇳🇿", tB: "Egito", bB: "🇪🇬", idA: "r2_j16a", idB: "r2_j16b" },
    { tA: "Argentina", bA: "🇦🇷", tB: "Áustria", bB: "🇦🇹", idA: "r2_j17a", idB: "r2_j17b" },
    { tA: "França", bA: "🇫🇷", tB: "Iraque", bB: "🇮🇶", idA: "r2_j18a", idB: "r2_j18b" },
    { tA: "Noruega", bA: "🇳🇴", tB: "Senegal", bB: "🇸🇳", idA: "r2_j19a", idB: "r2_j19b" },
    { tA: "Jordânia", bA: "🇯🇴", tB: "Argélia", bB: "🇩🇿", idA: "r2_j20a", idB: "r2_j20b" },
    { tA: "Portugal", bA: "🇵🇹", tB: "Uzbequistão", bB: "🇺🇿", idA: "r2_j21a", idB: "r2_j21b" },
    { tA: "Inglaterra", bA: "🏴󠁧󠁢󠁥󠁮󠁧󠁿", tB: "Gana", bB: "🇬🇭", idA: "r2_j22a", idB: "r2_j22b" },
    { tA: "Panamá", bA: "🇵🇦", tB: "Croácia", bB: "🇭🇷", idA: "r2_j23a", idB: "r2_j23b" },
    { tA: "Colômbia", bA: "🇨🇴", tB: "R. D. Congo", bB: "🇨🇩", idA: "r2_j24a", idB: "r2_j24b" }
];

let usuarioAtual = "";

function alternarRodada(n, btn) {
    document.querySelectorAll('.jogos-lista').forEach(el => el.classList.remove('ativo'));
    document.querySelectorAll('.btn-tab').forEach(el => el.classList.remove('ativo'));
    document.getElementById('lista-jogos-r' + n).classList.add('ativo');
    btn.classList.add('ativo');
}

function abrirPalpites(nome) {
    usuarioAtual = nome;
    atualizarModalRodada(1);
    document.getElementById("modal-palpites").classList.add("ativo");
}

function atualizarModalRodada(n) {
    const lista = n === 1 ? estruturaJogosR1 : estruturaJogosR2;
    document.getElementById("btn-m-r1").className = n === 1 ? "btn-tab ativo" : "btn-tab";
    document.getElementById("btn-m-r2").className = n === 2 ? "btn-tab ativo" : "btn-tab";
    
    let html = "";
    lista.forEach(j => {
        html += `<div class="jogo-card"><div>${j.tA} ${j.bA} X ${j.bB} ${j.tB}</div></div>`;
    });
    document.getElementById("modal-lista-jogos").innerHTML = html;
}

function fecharPalpites() { document.getElementById("modal-palpites").classList.remove("ativo"); }
</script></body></html>
