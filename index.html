        .pl-header::after {
            content: '';

            top: -50%;

        .pl-card {
            background: var(--pl-card);

            const pa = p[j.idA] !== undefined ? p[j.idA] : "-";
            const pb = p[j.idB] !== undefined ? p[j.idB] : "-";
            if (pa !== "-" && pb !== "-") {
                pts += calcularPontos(ra, rb, pa, pb);
            }
        }
    });
    
    const dia = p.palpite_do_dia;
    if (dia) {
        const jogo = jogos.find(j => j.idA === dia || j.idB === dia);
        if (jogo) {
            const ra = resultadosFinais[jogo.idA] !== undefined ? parseInt(resultadosFinais[jogo.idA]) : NaN;
            const rb = resultadosFinais[jogo.idB] !== undefined ? parseInt(resultadosFinais[jogo.idB]) : NaN;
            const pa = parseInt(p[dia]) || parseInt(p[jogo.idA]);
            const pb = parseInt(p[dia === jogo.idA ? jogo.idB : jogo.idA]);
            if (!isNaN(ra) && !isNaN(rb) && !isNaN(pa) && !isNaN(pb)) {
                if (ra === pa && rb === pb) {
                    pts += 5;
                }
            }
        }
    }
    
    if (p.coringa_usado) {
        pts = pts * 2;
    }
    
    return pts;
}

function getHistoricoPontos(jogador) {
    const historico = [];
    for (let r = 1; r <= 5; r++) {
        historico.push(getPontuacaoRodada(jogador, r));
    }
    return historico;
}

function getPontuacaoAcumulada(jogador) {
    const hist = getHistoricoPontos(jogador);
    let acum = 0;
    return hist.map(v => { acum += v; return acum; });
}

function atualizarGrafico() {
    const participantes = Object.keys(dadosPalpites);
    const labels = ['Rodada 1', 'Rodada 2', 'Rodada 3', 'Rodada 4', 'Rodada 5'];
    
    const datasets = participantes.map((nome, index) => {
        const dados = getPontuacaoAcumulada(nome);
        const cor = cores[index % cores.length];
        return {
            label: nome,
            data: dados,
            borderColor: cor,
            backgroundColor: cor + '20',
            borderWidth: 3,
            pointRadius: 4,
            pointBackgroundColor: cor,
            tension: 0.2,
            fill: false,
        };
    });
    
    const pontuacaoFinal = participantes.map(n => ({
        nome: n,
        pontos: getPontuacaoAcumulada(n)[4] || 0
    }));
    pontuacaoFinal.sort((a, b) => b.pontos - a.pontos);
    const ordem = pontuacaoFinal.map(p => p.nome);
    datasets.sort((a, b) => ordem.indexOf(a.label) - ordem.indexOf(b.label));
    
    const ctx = document.getElementById('graficoEvolucao').getContext('2d');
    if (chartInstance) { chartInstance.destroy(); }
    
    chartInstance = new Chart(ctx, {
        type: 'line',
        data: { labels, datasets },

            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            return context.dataset.label + ': ' + context.parsed.y + ' pts';
                        }
                    }
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    grid: { color: 'rgba(0,0,0,0.04)' },
                    title: {
                        display: true,
                        text: 'Pontos',

                    }

                    grid: { display: false },
                    ticks: { font: { size: 10 } }
                }
            }
        }
    });
    
    document.getElementById('grafico-legenda').innerHTML = datasets.map(d => {
        return `<div class="grafico-legenda-item">
            <div class="grafico-legenda-cor" style="background:${d.borderColor}"></div>

}

function calcularOddsDinamicas(jogo, rodada) {
    let casa = 0, empate = 0, fora = 0, total = 0;
    Object.values(dadosPalpites).forEach(p => {
        let pA = parseInt(p[jogo.idA]), pB = parseInt(p[jogo.idB]);
        if (!isNaN(pA) && !isNaN(pB)) {
            if (pA > pB) casa++; else if (pB > pA) fora++; else empate++;
            total++;
        }
    });
    if (total === 0) return "2.00 - 3.20 - 3.80";
    return `${(total/(casa||0.1)).toFixed(2)} - ${(total/(empate||0.1)).toFixed(2)} - ${(total/(fora||0.1)).toFixed(2)}`;
}
