<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bolão Copa do Mundo - Antas</title>
    <style>
        :root { --primary: #0f5132; --primary-dark: #082e1c; --accent: #ffc107; --bg: #f3f7f5; --surface: #ffffff; --text: #1c2421; --text-muted: #606f69; --border: rgba(15,81,50,0.08); --radius: 24px; --radius-sm: 14px; --shadow: 0 20px 40px rgba(15,81,50,0.04) }
        * { box-sizing: border-box; margin: 0; padding: 0 }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: var(--text); line-height: 1.6; padding-bottom: 80px }
        header { background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%); color: #fff; text-align: center; padding: 60px 20px 80px 20px; border-radius: 0 0 var(--radius) var(--radius); position: relative }
        header h1 { font-size: 2.6rem; font-weight: 700; letter-spacing: -1.5px; margin-bottom: 10px }
        header p { font-size: 1.1rem; opacity: .85; background: rgba(255,255,255,0.1); padding: 6px 16px; border-radius: 100px; display: inline-block }
        .container { max-width: 880px; margin: -40px auto 0 auto; padding: 0 16px; position: relative; z-index: 10 }
        .card { background: var(--surface); padding: 30px 20px; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 35px; border: 1px solid var(--border) }
        h2 { font-size: 1.5rem; font-weight: 700; color: var(--primary-dark); margin-bottom: 25px; letter-spacing: -0.5px }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px }
        .stat-card { background: rgba(15,81,50,0.03); padding: 20px; border-radius: var(--radius-sm); text-align: center; border: 1px solid var(--border) }
        .stat-value { font-size: 1.8rem; font-weight: 800; color: var(--primary); display: block }
        .stat-label { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600 }
        .table-container { overflow-x: auto }
        .ranking-table { width: 100%; border-collapse: collapse; text-align: left }
        .ranking-table th { background-color: rgba(15,81,50,0.04); color: var(--text-muted); padding: 18px; font-size: .9rem; text-transform: uppercase }
        .ranking-table td { padding: 18px; border-bottom: 1px solid var(--border); font-size: 1rem }
        .part-lista { display: flex; flex-direction: column; gap: 15px }
        .part-item { display: flex; align-items: center; padding: 20px 25px; background: rgba(15,81,50,0.02); border: 1px solid var(--border); border-radius: var(--radius-sm); justify-content: space-between }
        .btn-palpites { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: #fff; border: none; padding: 10px 22px; border-radius: 100px; font-weight: 600; cursor: pointer }
        .tab-container { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto }
        .tab-btn { padding: 8px 16px; cursor: pointer; border-radius: 20px; border: 1px solid var(--primary); background: transparent; font-weight: 600; color: var(--primary); white-space: nowrap }
        .tab-btn.active { background: var(--primary); color: #fff }
        .jogos-lista { display: flex; flex-direction: column; gap: 18px }
        .jogo-card { padding: 16px; background: var(--surface); border-radius: var(--radius-sm); border: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between }
        .placar-box { background: rgba(15,81,50,0.03); padding: 8px 15px; border-radius: 10px; font-weight: 700 }
        .news-feed { display: flex; flex-direction: column; gap: 20px }
        .news-card { border-left: 4px solid var(--primary); padding: 5px 0 5px 18px }
        .evolucao-container { display: flex; flex-direction: column; gap: 12px }
        .evolucao-linha { display: flex; align-items: center; gap: 10px }
        .evolucao-barra-bg { flex: 1; background: rgba(15,81,50,0.05); height: 14px; border-radius: 100px }
        .evolucao-barra-fill { background: var(--primary); height: 100%; border-radius: 100px }
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(8,46,28,0.4); z-index: 100; align-items: center; justify-content: center }
        .modal.ativo { display: flex }
        .modal-conteudo { background: var(--surface); padding: 30px; border-radius: var(--radius); max-width: 500px; width: 90% }
    </style>
</head>
<body>
<header><h1>Bolão Copa do Mundo</h1><p>Grupo Oficial: Os Antas 🐗</p></header>
<div class="container">
    <div class="card">
        <h2>Classificação Geral</h2>
        <div class="stats-grid">
            <div class="stat-card"><span class="stat-value">72</span><span class="stat-label">Jogos Previstos</span></div>
            <div class="stat-card"><span class="stat-value">0</span><span class="stat-label">Média do Grupo</span></div>
        </div>
        <div class="table-container"><table class="ranking-table"><thead><tr><th>Posição</th><th>Participante</th><th>Points</th></tr></thead><tbody id="tabela-ranking"></tbody></table></div>
    </div>
    <div class="card"><h2>Painel de Evolução 📈</h2><div class="evolucao-container" id="painel-evolucao"></div></div>
    <div class="card"><h2>Lista de Participantes</h2><div class="part-lista" id="lista-participantes"></div></div>
    <div class="card">
        <div class="tab-container">
            <button class="tab-btn active" id="btnR1" onclick="renderizarRodada(1)">R1</button>
            <button class="tab-btn" id="btnR2" onclick="renderizarRodada(2)">R2</button>
            <button class="tab-btn" id="btnR3" onclick="renderizarRodada(3)">R3</button>
        </div>
        <div class="jogos-lista" id="lista-jogos"></div>
    </div>
    <div class="card"><h2>Últimas Notícias 📰</h2><div class="news-feed" id="news-container"></div></div>
</div>
<div id="modal" class="modal"><div class="modal-conteudo"><button onclick="document.getElementById('modal').classList.remove('ativo')">Fechar</button><h3 id="modal-titulo">Palpites</h3><div id="modal-body"></div></div></div>
<script>
const part = ["Walishow", "Paulão", "Gu", "Campeão de 2026 Okc Freitas", "Fish", "Psico", "Sid", "Lucas", "Wix", "Julian", "soltin", "Samuel", "Abner"];
const r1 = [{a:"México",b:"África do Sul"},{a:"Brasil",b:"Marrocos"}];
const r2 = [{a:"Suíça",b:"Bósnia"},{a:"Brasil",b:"Haiti"}];
const r3 = [{a:"Escócia",b:"Brasil"},{a:"Suíça",b:"Canadá"}];
function renderizarRodada(n) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`btnR${n}`).classList.add('active');
    const jogos = n === 1 ? r1 : (n === 2 ? r2 : r3);
    document.getElementById("lista-jogos").innerHTML = jogos.map(j => `<div class="jogo-card"><span>${j.a}</span><span class="placar-box">X</span><span>${j.b}</span></div>`).join('');
}
window.onload = () => {
    renderizarRodada(1);
    document.getElementById("tabela-ranking").innerHTML = part.map((p,i) => `<tr><td>${i+1}º</td><td>${p}</td><td>0</td></tr>`).join('');
    document.getElementById("lista-participantes").innerHTML = part.map(p => `<div class="part-item"><span>${p}</span><button class="btn-palpites" onclick="document.getElementById('modal').classList.add('ativo')">Palpites</button></div>`).join('');
    document.getElementById("painel-evolucao").innerHTML = part.map(p => `<div class="evolucao-linha"><span>${p}</span><div class="evolucao-barra-bg"><div class="evolucao-barra-fill" style="width:20%"></div></div></div>`).join('');
    document.getElementById("news-container").innerHTML = `<div class="news-card"><h3>3ª Rodada liberada!</h3></div>`;
};
</script>
</body>
</html>
