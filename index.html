<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bolão Copa do Mundo - Antas</title><style>:root { --primary: #0f5132; --primary-dark: #082e1c; --accent: #ffc107; --bg: #f3f7f5; --surface: #ffffff; --text: #1c2421; --text-muted: #606f69; --border: rgba(15,81,50,0.08); --radius: 24px; --radius-sm: 14px; --shadow: 0 20px 40px rgba(15,81,50,0.04) } * { box-sizing: border-box; margin: 0; padding: 0 } body { font-family: 'Plus Jakarta Sans',sans-serif; background-color: var(--bg); color: var(--text); line-height: 1.6; padding-bottom: 80px } header { background: linear-gradient(135deg,var(--primary-dark) 0%,var(--primary) 100%); color: #fff; text-align: center; padding: 60px 20px 80px 20px; border-radius: 0 0 var(--radius) var(--radius); position: relative } header h1 { font-size: 2.6rem; font-weight: 700; letter-spacing: -1.5px; margin-bottom: 10px } header p { font-size: 1.1rem; opacity: .85; font-weight: 500; background: rgba(255,255,255,0.1); padding: 6px 16px; border-radius: 100px; display: inline-block } .container { max-width: 880px; margin: -40px auto 0 auto; padding: 0 16px; position: relative; z-index: 10 } .card { background: var(--surface); padding: 30px 20px; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 35px; border: 1px solid var(--border) } h2 { font-size: 1.5rem; font-weight: 700; color: var(--primary-dark); margin-bottom: 25px; letter-spacing: -0.5px } .table-container { overflow-x: auto } .ranking-table { width: 100%; border-collapse: collapse; text-align: left } .ranking-table th { background-color: rgba(15,81,50,0.04); color: var(--text-muted); font-weight: 600; padding: 18px; font-size: .9rem; text-transform: uppercase; letter-spacing: 1px; border-radius: var(--radius-sm) var(--radius-sm) 0 0 } .ranking-table td { padding: 18px; border-bottom: 1px solid var(--border); font-size: 1rem } .ranking-table tr:last-child td { border-bottom: none } .sem-dados { text-align: center; color: var(--text-muted); padding: 50px 18px!important; font-style: italic } .part-lista { display: flex; flex-direction: column; gap: 15px } .part-item { display: flex; align-items: center; padding: 20px 25px; background: rgba(15,81,50,0.02); border: 1px solid var(--border); border-radius: var(--radius-sm); justify-content: space-between; transition: all .3s ease } .part-item:hover { transform: scale(1.01); background: rgba(15,81,50,0.04) } .part-nome { font-weight: 700; font-size: 1.2rem; color: var(--primary-dark) } .btn-palpites { background: linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%); color: #fff; border: none; padding: 10px 22px; border-radius: 100px; font-weight: 600; cursor: pointer; font-family: inherit; font-size: .95rem; box-shadow: 0 10px 20px rgba(15,81,50,0.15); transition: all .3s ease } .btn-palpites:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(15,81,50,0.25) } .jogos-lista { display: flex; flex-direction: column; gap: 18px } .jogo-card { display: flex; flex-direction: column; padding: 16px 12px; background: var(--surface); border-radius: var(--radius-sm); border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.02); transition: all .3s ease; gap: 12px } .jogo-card:hover { transform: translateY(-4px); border-color: rgba(15,81,50,0.2); box-shadow: 0 20px 35px rgba(15,81,50,0.06) } .jogo-principal { display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 8px } .time-container { flex: 1; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 1rem; color: var(--text); min-width: 0 } .time-container span:not(.bandeira) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap } .time-container.casa { justify-content: flex-end; text-align: right } .time-container.fora { justify-content: flex-start; text-align: left } .bandeira { font-size: 1.4rem; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.06)); flex-shrink: 0 } .placar-container { display: flex; flex-direction: column; align-items: center; gap: 4px; flex-shrink: 0; width: 125px } .placar-wrapper { display: flex; align-items: center; gap: 6px } .placar-box { width: 38px; height: 38px; background: rgba(15,81,50,0.03); border: 2px solid var(--border); border-radius: 10px; text-align: center; font-size: 1.1rem; font-weight: 700; color: var(--primary-dark); display: flex; align-items: center; justify-content: center } .divisor { font-weight: 700; color: rgba(15,81,50,0.3); font-size: .85rem } .jogo-odds { font-size: .65rem; font-weight: 700; color: var(--text-muted); background: rgba(15,81,50,0.05); padding: 3px 8px; border-radius: 100px; letter-spacing: 0.2px; white-space: nowrap; text-align: center; width: 100% } .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(8,46,28,0.4); backdrop-filter: blur(8px); z-index: 100; align-items: center; justify-content: center; padding: 16px } .modal.ativo { display: flex } .modal-conteudo { background: var(--surface); padding: 30px 16px; border-radius: var(--radius); max-width: 650px; width: 100%; box-shadow: 0 30px 60px rgba(8,46,28,0.15); position: relative; animation: modalShow .4s cubic-bezier(0.34,1.56,0.64,1); max-height: 85vh; overflow-y: auto; border: 1px solid rgba(255,255,255,0.8) } .modal-fechar { position: absolute; top: 20px; right: 16px; background: rgba(15,81,50,0.05); border: none; font-size: 1.3rem; cursor: pointer; color: var(--primary-dark); width: 32px; height: 32px; border-radius: 100px; display: flex; align-items: center; justify-content: center; transition: all .2s } .modal-fechar:hover { background: rgba(15,81,50,0.1); transform: rotate(90deg) } .tab-container { display: flex; gap: 10px; margin-bottom: 15px; } .tab-btn { padding: 8px 16px; cursor: pointer; border-radius: 20px; border: 1px solid var(--primary); background: transparent; font-weight: 600; color: var(--primary); transition: 0.3s; } .tab-btn.active { background: var(--primary); color: #fff; } @keyframes modalShow { from { opacity: 0; transform: translateY(30px) } to { opacity: 1; transform: translateY(0) } }</style></head><body><header><h1>Bolão Copa do Mundo</h1><p>Grupo Oficial: Os Antas 🐗</p></header>
<div class="container"><div class="card"><h2>Classificação Geral</h2><table class="ranking-table"><tbody id="tabela-ranking"></tbody></table></div><div class="card"><h2>Lista de Participantes</h2><div class="part-lista" id="lista-participantes"></div></div></div>
<div id="modal-palpites" class="modal" onclick="fecharModalExterno(event)"><div class="modal-conteudo"><button class="modal-fechar" onclick="fecharPalpites()">&times;</button><h2 id="modal-titulo">Palpites</h2><div class="tab-container"><button class="tab-btn active" id="btnModalR1" onclick="renderizarModalRodada(1)">Rodada 1</button><button class="tab-btn" id="btnModalR2" onclick="renderizarModalRodada(2)">Rodada 2</button></div><div class="jogos-lista" id="modal-lista-jogos"></div></div></div>
<script>
// --- DADOS DOS PARTICIPANTES (MANTENHA OS SEUS AQUI) ---
const dadosPalpites = {
    "Psico": { 
        // Rodada 1
        j1_a: "2", j1_b: "1", j2_a: "1", j2_b: "1", j3_a: "0", j3_b: "0", j4_a: "1", j4_b: "2", j5_a: "3", j5_b: "0", j6_a: "0", j6_b: "2", j7_a: "1", j7_b: "2", j8_a: "1", j8_b: "2", j9_a: "3", j9_b: "0", j10_a: "1", j10_b: "2", j11_a: "1", j11_b: "3", j12_a: "1", j12_b: "2", j13_a: "0", j13_b: "1", j14_a: "2", j14_b: "0", j15_a: "2", j15_b: "0", j16_a: "1", j16_b: "2", j17_a: "2", j17_b: "1", j18_a: "0", j18_b: "4", j19_a: "2", j19_b: "1", j20_a: "2", j20_b: "0", j21_a: "3", j21_b: "0",
        // Rodada 2
        j22_a: "1", j22_b: "0", j23_a: "1", j23_b: "1", j24_a: "2", j24_b: "2", j25_a: "2", j25_b: "2", j26_a: "3", j26_b: "1", j27_a: "1", j27_b: "1", j28_a: "3", j28_b: "0", j29_a: "1", j29_b: "1", j30_a: "1", j30_b: "2", j31_a: "2", j31_b: "1", j32_a: "3", j32_b: "0", j33_a: "1", j33_b: "1", j34_a: "1", j34_b: "0", j35_a: "2", j35_b: "1", j36_a: "1", j36_b: "0", j37_a: "1", j37_b: "2", j38_a: "1", j38_b: "0", j39_a: "3", j39_b: "1", j40_a: "2", j40_b: "1", j41_a: "1", j41_b: "1", j42_a: "2", j42_b: "0", j43_a: "1", j43_b: "2", j44_a: "1", j44_b: "2", j45_a: "3", j45_b: "0" 
    }
    // Adicione os outros aqui: "Walishow": {...}, "Paulão": {...}, etc.
};
// --- (Manter o resto das suas variáveis de Jogos e Resultados) ---

let participanteAtual = "";
let rodadaModal = 1;

function abrirPalpites(nome) {
    participanteAtual = nome;
    renderizarModalRodada(1);
    document.getElementById("modal-palpites").classList.add("ativo");
}

function renderizarModalRodada(rodada) {
    rodadaModal = rodada;
    document.getElementById("btnModalR1").className = rodada === 1 ? "tab-btn active" : "tab-btn";
    document.getElementById("btnModalR2").className = rodada === 2 ? "tab-btn active" : "tab-btn";
    
    const jogos = rodada === 1 ? jogosR1 : jogosR2;
    const t = dadosPalpites[participanteAtual];
    let a = "";
    jogos.forEach(jogo => {
        let pA = t[jogo.idA] || "-", pB = t[jogo.idB] || "-";
        a += `<div class="jogo-card"><div class="jogo-principal"><div class="time-container casa"><span>${jogo.tA}</span></div><div class="placar-container"><div class="placar-box">${pA}</div><span class="divisor">X</span><div class="placar-box">${pB}</div></div><div class="time-container fora"><span>${jogo.tB}</span></div></div></div>`;
    });
    document.getElementById("modal-lista-jogos").innerHTML = a;
}

function fecharPalpites(){document.getElementById("modal-palpites").classList.remove("ativo")}
function fecharModalExterno(e){"modal-palpites"===e.target.id&&fecharPalpites()}
// --- (Manter suas funções de Classificação e Renderização) ---
</script></body></html>
