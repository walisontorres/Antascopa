function calcularPontos(rA, rB, pA, pB) {
    if (rA === pA && rB === pB) return 10;
    if ((rA - rB) === (pA - pB) && ((rA > rB && pA > pB) || (rB > rA && pB > pA))) return 6;
    if ((rA - rB) === 0 && (pA - pB) === 0) return 5;
    if ((rA > rB && pA > pB) || (rB > rA && pB > pA)) return 3;
    return 0;
}

function calcularOddsDinamicas(jogo) {
    let casa = 0, empate = 0, fora = 0, total = 0;
    Object.values(dadosPalpites).forEach(p => {
        let pA = parseInt(p[jogo.idA]), pB = parseInt(p[jogo.idB]);
        if (!isNaN(pA) && !isNaN(pB)) {
            if (pA > pB) casa++; else if (pB > pA) fora++; else empate++;
            total++;
        }
    });
    if (total === 0) return "1.90 - 3.20 - 3.80";
    let oCasa = (total / (casa || 0.1)).toFixed(2);
    let oEmp = (total / (empate || 0.1)).toFixed(2);
    let oFora = (total / (fora || 0.1)).toFixed(2);
    return `${oCasa} - ${oEmp} - ${oFora}`;
}

function abrirPalpites(e, rodada=1) {
    document.getElementById("modal-titulo").innerText = `Palpites de ${e}`;
    const t = dadosPalpites[e];
    let jogos = jogosR1;
    if(rodada === 2) jogos = jogosR2;
    else if(rodada === 3) jogos = jogosR3;
    
    let html = `<div class="tab-container" style="justify-content:center">
        <button class="tab-btn ${rodada===1?'active':''}" onclick="abrirPalpites('${e}',1)">Rodada 1</button>
        <button class="tab-btn ${rodada===2?'active':''}" onclick="abrirPalpites('${e}',2)">Rodada 2</button>
        <button class="tab-btn ${rodada===3?'active':''}" onclick="abrirPalpites('${e}',3)">Rodada 3</button>
    </div><div class="jogos-lista">`;
    
    jogos.forEach((jogo) => {
        const resA = parseInt(resultadosFinais[jogo.idA]);
        const resB = parseInt(resultadosFinais[jogo.idB]);
        const pA = t ? parseInt(t[jogo.idA]) : NaN;
        const pB = t ? parseInt(t[jogo.idB]) : NaN;
        const pts = (isNaN(resA) || isNaN(resB)) ? 0 : calcularPontos(resA, resB, pA, pB);
        html += `<div class="jogo-card"><div style="font-size:0.75rem; font-weight:700; color:var(--primary); text-align:center;">Pontos: ${pts}</div><div class="jogo-principal"><div class="time-container casa"><span>${jogo.tA}</span><span class="bandeira">${jogo.bA}</span></div><div class="placar-container"><div class="placar-wrapper"><div class="placar-box">${isNaN(pA)?'-':pA}</div>X<div class="placar-box">${isNaN(pB)?'-':pB}</div></div></div><div class="time-container fora"><span class="bandeira">${jogo.bB}</span><span>${jogo.tB}</span></div></div></div>`;
    });
    html += `</div>`;
    document.getElementById("modal-container-interno").innerHTML = html;
    document.getElementById("modal-palpites").classList.add("ativo");
}

function fecharPalpites(){document.getElementById("modal-palpites").classList.remove("ativo")}function fecharModalExterno(e){"modal-palpites"===e.target.id&&fecharPalpites()}

function atualizarClassificacao(){
    let e=[];
    Object.keys(dadosPalpites).forEach(participante=>{
        let ptsTotal=0, ptsR1=0, ptsR2=0, ptsR3=0, cravar=0, seqPontos=0, maxSeqPontos=0, seqZero=0, maxSeqZero=0;
        const p = dadosPalpites[participante];
        
        [...jogosR1, ...jogosR2, ...jogosR3].forEach(jogo=>{
            const resA = parseInt(resultadosFinais[jogo.idA]);
            const resB = parseInt(resultadosFinais[jogo.idB]);
            
            if(!isNaN(resA) && !isNaN(resB)) {
                const pA = parseInt(p[jogo.idA]);
                const pB = parseInt(p[jogo.idB]);
                const pts = calcularPontos(resA, resB, pA, pB);
                
                ptsTotal += pts;
                if(jogo.idA.startsWith('r3')) ptsR3 += pts; else if(jogo.idA.startsWith('r2')) ptsR2 += pts; else ptsR1 += pts;
                
                if(pts === 10) cravar++;
                
                if(pts > 0){ 
                    seqPontos += pts; 
                    if(seqPontos > maxSeqPontos) maxSeqPontos = seqPontos;
                    seqZero = 0; 
                } else { 
                    seqZero++; 
                    if(seqZero > maxSeqZero) maxSeqZero = seqZero;
                    seqPontos = 0; 
                }
            }
        });
        e.push({nome:participante, pontos:ptsTotal, ptsR1:ptsR1, ptsR2:ptsR2, ptsR3:ptsR3, cravar:cravar, maxSeqPontos:maxSeqPontos, maxSeqZero:maxSeqZero});
    });
    e.sort((a,b)=>b.pontos-a.pontos);
    
    let htmlTabela=""; e.forEach((p,i)=>htmlTabela+=`<tr><td style="font-weight:700;padding-left:25px">${i+1}º</td><td>${p.nome}</td><td style="text-align:center;font-weight:700;color:var(--primary)">${p.pontos}</td></tr>`);
    document.getElementById("tabela-ranking").innerHTML=htmlTabela;
    
    renderizarEstatisticas(e);
    renderizarTabelaEstatisticaDinamica(e);
    salvarERenderizarEvolucao(e);
    gerarNoticias(e);
    
    let htmlPart=""; Object.keys(dadosPalpites).forEach(n=>{htmlPart+=`<div class="part-item"><span class="part-nome">${n}</span><button class="btn-palpites" onclick="abrirPalpites('${n}')">Ver Palpites</button></div>`});
    document.getElementById("lista-participantes").innerHTML=htmlPart;
}

function renderizarTabelaEstatisticaDinamica(ranking) {
    const maiorPontuadorRodada1 = [...ranking].sort((a, b) => b.ptsR1 - a.ptsR1)[0];
    const maiorPontuadorRodada2 = [...ranking].sort((a, b) => b.ptsR2 - a.ptsR2)[0];
    const maiorPontuadorRodada3 = [...ranking].sort((a, b) => b.ptsR3 - a.ptsR3)[0];
    const top5Cravadas = [...ranking].sort((a, b) => b.cravar - a.cravar).slice(0, 5);
    const jogadorMaisTempoZero = [...ranking].sort((a, b) => b.maxSeqZero - a.maxSeqZero)[0];
    const jogadorMaisSequencia = [...ranking].sort((a, b) => b.maxSeqPontos - a.maxSeqPontos)[0];

    let html = `
        <div class="table-container" style="margin-bottom:20px">
            <table class="ranking-table">
                <thead><tr><th>Estatística</th><th>Destaque</th><th>Valor</th></tr></thead>
                <tbody>
                    <tr><td>Maior Pontuador R1</td><td>${maiorPontuadorRodada1.nome}</td><td>${maiorPontuadorRodada1.ptsR1} pts</td></tr>
                    <tr><td>Maior Pontuador R2</td><td>${maiorPontuadorRodada2.nome}</td><td>${maiorPontuadorRodada2.ptsR2} pts</td></tr>
                    <tr><td>Maior Pontuador R3</td><td>${maiorPontuadorRodada3.nome}</td><td>${maiorPontuadorRodada3.ptsR3} pts</td></tr>
                    <tr><td>Melhor Sequência de Pontos</td><td>${jogadorMaisSequencia.nome}</td><td>${jogadorMaisSequencia.maxSeqPontos} pts</td></tr>
                    <tr><td>Mais Tempo Sem Pontuar</td><td>${jogadorMaisTempoZero.nome}</td><td>${jogadorMaisTempoZero.maxSeqZero} jogos</td></tr>
                </tbody>
            </table>
        </div>
        <h2 style="font-size:1.2rem">Top 5 - Mestres do Placar Exato</h2>
        <div class="evolucao-container">
            ${top5Cravadas.map(p => `
                <div class="evolucao-linha">
                    <span class="evolucao-nome">${p.nome}</span>
                    <div class="evolucao-barra-bg"><div class="evolucao-barra-fill" style="width:${p.cravar * 20}%"></div></div>
                    <span class="evolucao-pts">${p.cravar} acertos</span>
                </div>
            `).join('')}
        </div>`;
    document.getElementById("estatisticas-dinamicas").innerHTML = html;
}

function renderizarEstatisticas(ranking){const totalPts=ranking.reduce((acc,curr)=>acc+curr.pontos,0);const avgPts=(totalPts/ranking.length).toFixed(1);const maxPts=ranking[0].pontos;document.getElementById("stats-container").innerHTML=`<div class="stat-card"><span class="stat-value">${maxPts}</span><span class="stat-label">Maior Pontuação</span></div><div class="stat-card"><span class="stat-value">${avgPts}</span><span class="stat-label">Média de Grupo</span></div><div class="stat-card"><span class="stat-value">${ranking.length}</span><span class="stat-label">Antas Ativos</span></div>`}
function gerarNoticias(ranking){const container=document.getElementById("news-container");const topo=ranking[0];container.innerHTML=`<div class="news-card"><span class="news-tag">LÍDER</span><h3 class="news-title">${topo.nome} na liderança!</h3><p class="news-text">Com ${topo.pontos} pontos.</p></div>`}
function salvarERenderizarEvolucao(e){let t=JSON.parse(localStorage.getItem("bolao_posicoes_anteriores")||"{}"),a=!t||0===Object.keys(t).length,l={},n=e[0].pontos||1;let r="";e.forEach((e,o)=>{let s=o+1;l[e.nome]=s;let i="-",c="manteve";if(!a&&t[e.nome]){let d=t[e.nome];if(s<d){i="▲";c="subiu"}else if(s>d){i="▼";c="desceu"}}let d=e.pontos/n*100;r+=`<div class="evolucao-linha"><span class="evolucao-nome">${e.nome}</span><div class="evolucao-barra-bg"><div class="evolucao-barra-fill" style="width:${Math.max(5,d)}%"></div></div><span class="evolucao-pts">${e.pontos} pts</span><span class="evolucao-tendencia ${c}">${i}</span></div>`});localStorage.setItem("bolao_posicoes_anteriores",JSON.stringify(l));document.getElementById("painel-evolucao").innerHTML=r}

renderizarPorRodada(1);
atualizarClassificacao();
</script>
