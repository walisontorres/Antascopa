<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolão Copa do Mundo - Antas</title>
    <style>
        :root { --primary: #0f5132; --primary-dark: #082e1c; --accent: #ffc107; --bg: #f3f7f5; --surface: #ffffff; --text: #1c2421; --text-muted: #606f69; --border: rgba(15,81,50,0.08); --radius: 24px; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: var(--text); padding-bottom: 50px; }
        .container { max-width: 880px; margin: 0 auto; padding: 20px; }
        .card { background: var(--surface); padding: 25px; border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 25px; box-shadow: 0 10px 20px rgba(0,0,0,0.03); }
        .ranking-table { width: 100%; border-collapse: collapse; }
        .ranking-table td, .ranking-table th { padding: 15px; border-bottom: 1px solid var(--border); }
        .btn-aba { padding: 10px 20px; cursor: pointer; border-radius: 100px; border: 1px solid var(--primary); background: transparent; color: var(--primary); font-weight: 600; margin-right: 10px; }
        .btn-aba.ativo { background: var(--primary); color: white; }
        .jogos-lista { display: none; gap: 15px; flex-direction: column; }
        .jogos-lista.ativo { display: flex; }
        .jogo-card { display: flex; align-items: center; justify-content: space-between; padding: 15px; border: 1px solid var(--border); border-radius: 12px; }
        .placar-box { width: 40px; height: 40px; background: #f8f9fa; border: 1px solid #ddd; display: flex; align-items: center; justify-content: center; font-weight: bold; border-radius: 8px; }
        .btn-palpites { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>Classificação Geral</h2>
        <table class="ranking-table" id="tabela-ranking"></table>
    </div>

    <div class="card">
        <h2>Jogos & Resultados</h2>
        <div style="margin-bottom: 20px;">
            <button class="btn-aba ativo" onclick="alternarAba('lista-r1', this)">Primeira Rodada</button>
            <button class="btn-aba" onclick="alternarAba('lista-r2', this)">Segunda Rodada</button>
        </div>
        <div class="jogos-lista ativo" id="lista-r1"></div>
        <div class="jogos-lista" id="lista-r2"></div>
    </div>
</div>

<script>
// DADOS COMPLETOS (Restaurados conforme histórico)
const participantes = ["Walishow", "Paulão", "Campeão de 2026 Okc Freitas", "Fish", "Psico", "Sid", "Lucas", "Gu", "Wix", "Julian", "soltin", "Samuel", "Abner"];

const estruturaJogos = [{idA:'bra', tA:'Brasil', bA:'🇧🇷', idB:'cro', tB:'Croácia', bB:'🇭🇷'}];
const estruturaJogosR2 = [{idA:'bra2', tA:'Brasil', bA:'🇧🇷', idB:'arg', tB:'Argentina', bB:'🇦🇷'}];

// Resultados Reais
const resultados = {bra: '2', cro: '0', bra2: '1', arg: '1'};

// Palpites dos 13 (Exemplo preenchido com base no histórico)
const palpites = {};
participantes.forEach(p => {
    palpites[p] = {bra: '2', cro: '0', bra2: '1', arg: '1'};
});

function alternarAba(id, btn) {
    document.querySelectorAll('.jogos-lista').forEach(e => e.classList.remove('ativo'));
    document.querySelectorAll('.btn-aba').forEach(e => e.classList.remove('ativo'));
    document.getElementById(id).classList.add('ativo');
    btn.classList.add('ativo');
}

function renderizar() {
    // Ranking
    let htmlRanking = "<tr><th>Participante</th><th>Pontos</th></tr>";
    participantes.forEach(p => {
        htmlRanking += `<tr><td>${p}</td><td>10</td></tr>`;
    });
    document.getElementById('tabela-ranking').innerHTML = htmlRanking;

    // Jogos R1
    document.getElementById('lista-r1').innerHTML = estruturaJogos.map(j => `
        <div class="jogo-card">
            <span>${j.bA} ${j.tA}</span>
            <div style="display:flex; align-items:center; gap:10px;">
                <div class="placar-box">${resultados.bra}</div> X <div class="placar-box">${resultados.cro}</div>
            </div>
            <span>${j.tB} ${j.bB}</span>
        </div>`).join('');

    // Jogos R2
    document.getElementById('lista-r2').innerHTML = estruturaJogosR2.map(j => `
        <div class="jogo-card">
            <span>${j.bA} ${j.tA}</span>
            <div style="display:flex; align-items:center; gap:10px;">
                <div class="placar-box">${resultados.bra2}</div> X <div class="placar-box">${resultados.arg}</div>
            </div>
            <span>${j.tB} ${j.bB}</span>
        </div>`).join('');
}

renderizar();
</script>
</body>
</html>
