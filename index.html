<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolão Copa do Mundo - Os Antas 🐗</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b3321;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #11422c;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h1, h2 {
            text-align: center;
            color: #f3cd56;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: #164e35;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #1f6b4a;
        }
        th {
            background-color: #f3cd56;
            color: #0b3321;
        }
        tr:hover {
            background-color: #1d5f41;
        }
        .pos {
            font-weight: bold;
            width: 50px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Bolão Copa do Mundo - Os Antas 🐗</h1>
    
    <h2>🏆 Classificação Atualizada</h2>
    <table>
        <thead>
            <tr>
                <th>Pos</th>
                <th>Participante</th>
                <th>Pontos</th>
            </tr>
        </thead>
        <tbody id="tabela-classificacao">
            <!-- Os dados serão inseridos aqui pelo JavaScript -->
        </tbody>
    </table>
</div>

<script>
// 1. LISTA DE PARTICIPANTES (Bases do seu Bolão)
const participantes = [
    { id: "walishow", nome: "Walishow", pontos: 0 },
    { id: "paulao", nome: "Paulão", pontos: 0 },
    { id: "okc_freitas", nome: "Okc Freitas", pontos: 0 },
    { id: "fish", nome: "Fish", pontos: 0 },
    { id: "psico", nome: "Psico", pontos: 0 },
    { id: "sid", nome: "Sid", pontos: 0 },
    { id: "lucas", nome: "Lucas", pontos: 0 },
    { id: "gu", nome: "Gu", pontos: 0 },
    { id: "wix", nome: "Wix", pontos: 0 },
    { id: "julian", nome: "Julian", pontos: 0 },
    { id: "soltin", nome: "soltin", pontos: 0 },
    { id: "samuel", nome: "Samuel", pontos: 0 },
    { id: "abner", nome: "Abner", pontos: 0 }
];

// 2. CADASTRO DOS JOGOS E RESULTADOS REAIS
const jogos = [
    { id: "jogo1", time1: "EUA", time2: "Paraguai", gols1: null, gols2: null }, // Jogo em aberto
    { id: "jogo2", time1: "Canadá", time2: "Bósnia", gols1: 1, gols2: 1 }      // Resultado finalizado
];

// 3. BANCO DE DADOS DOS PALPITES DO DIA
const dadosPalpites = {
    "walishow":   { "jogo1": { gols1: 1, gols2: 1 }, "jogo2": { gols1: 0, gols2: 0 } },
    "paulao":     { "jogo1": { gols1: 1, gols2: 1 }, "jogo2": { gols1: 1, gols2: 1 } },
    "okc_freitas":{ "jogo1": { gols1: 1, gols2: 0 }, "jogo2": { gols1: 0, gols2: 1 } },
    "fish":       { "jogo1": { gols1: 0, gols2: 1 }, "jogo2": { gols1: 1, gols2: 0 } },
    "psico":      { "jogo1": { gols1: 1, gols2: 2 }, "jogo2": { gols1: 0, gols2: 0 } },
    "sid":        { "jogo1": { gols1: 2, gols2: 1 }, "jogo2": { gols1: 2, gols2: 1 } },
    "lucas":      { "jogo1": { gols1: 1, gols2: 1 }, "jogo2": { gols1: 1, gols2: 1 } },
    "gu":         { "jogo1": { gols1: 2, gols2: 0 }, "jogo2": { gols1: 1, gols2: 1 } },
    "wix":        { "jogo1": { gols1: 0, gols2: 2 }, "jogo2": { gols1: 0, gols2: 1 } },
    "julian":     { "jogo1": { gols1: 2, gols2: 1 }, "jogo2": { gols1: 1, gols2: 1 } },
    "soltin":     { "jogo1": { gols1: 2, gols2: 1 }, "jogo2": { gols1: 1, gols2: 0 } },
    "samuel":     { "jogo1": { gols1: 2, gols2: 1 }, "jogo2": { gols1: 1, gols2: 2 } },
    "abner":      { "jogo1": { gols1: 2, gols2: 1 }, "jogo2": { gols1: 2, gols2: 0 } }
};

// 4. FUNÇÃO RECORRIGIDA COM AS REGRAS OFICIAIS DA IMAGEM
function atualizarClassificacao() {
    // Zera os pontos para recalcular do zero com segurança
    participantes.forEach(p => p.pontos = 0);

    jogos.forEach(jogo => {
        // Só calcula se o jogo já tiver resultado preenchido
        if (jogo.gols1 !== null && jogo.gols2 !== null) {
            const resGols1 = jogo.gols1;
            const resGols2 = jogo.gols2;
            const saldoReal = resGols1 - resGols2;

            participantes.forEach(p => {
                const palpite = dadosPalpites[p.id]?.[jogo.id];
                if (!palpite) return; // Pula se não houver palpite cadastrado

                const palGols1 = palpite.gols1;
                const palGols2 = palpite.gols2;
                const saldoPalpite = palGols1 - palGols2;

                // Regra 1: Acertou o placar exato (10 pontos)
                if (palGols1 === resGols1 && palGols2 === resGols2) {
                    p.pontos += 10;
                }
                // Regra 2: Vendedor + Saldo de gols (6 pontos)
                else if (saldoReal !== 0 && saldoPalpite === saldoReal && ((resGols1 > resGols2 && palGols1 > palGols2) || (resGols2 > resGols1 && palGols2 > palGols1))) {
                    p.pontos += 6;
                }
                // Regra 3: Empate não exato (5 pontos)
                else if (saldoReal === 0 && saldoPalpite === 0) {
                    p.pontos += 5;
                }
                // Regra 4: Vendedor apenas tendência (3 pontos)
                else if ((resGols1 > resGols2 && palGols1 > palGols2) || (resGols2 > resGols1 && palGols2 > palGols1)) {
                    p.pontos += 3;
                }
            });
        }
    });

    // Ordena os participantes do maior para o menor ponto
    participantes.sort((a, b) => b.pontos - a.pontos);

    // Renderiza na tela
    exibirTabelaClassificacao();
}

// 5. RENDERIZADOR DA TABELA HTML
function exibirTabelaClassificacao() {
    const tbody = document.getElementById("tabela-classificacao");
    tbody.innerHTML = "";

    participantes.forEach((p, index) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td class="pos">${index + 1}º</td>
            <td>${p.nome}</td>
            <td><strong>${p.pontos}</strong> pts</td>
        `;
        tbody.appendChild(tr);
    });
}

// Executa a função assim que abrir a página para gerar o ranking inicial
atualizarClassificacao();
</script>

</body>
</html>
