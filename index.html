<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolão Copa do Mundo - Antas</title>
    <style>
        :root { --primary: #0f5132; --primary-dark: #082e1c; --accent: #ffc107; --bg: #f3f7f5; --surface: #ffffff; --text: #1c2421; --border: rgba(15,81,50,0.08); --radius: 20px; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding-bottom: 50px; }
        header { background: var(--primary-dark); color: #fff; padding: 40px 20px; text-align: center; }
        .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }
        .card { background: var(--surface); padding: 20px; border-radius: var(--radius); box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h2 { color: var(--primary); font-size: 1.2rem; margin-bottom: 15px; text-transform: uppercase; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
        .aviso { background: var(--accent); padding: 10px; border-radius: 8px; font-weight: bold; text-align: center; margin-bottom: 15px; }
        .jogo-linha { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 0.9rem; }
    </style>
</head>
<body>

<header>
    <h1>Bolão Antas Copa 2026</h1>
</header>

<div class="container">
    <!-- Classificação -->
    <div class="card">
        <h2>Classificação</h2>
        <table id="tabela-ranking">
            <thead><tr><th>Pos</th><th>Nome</th><th>Pts</th></tr></thead>
            <tbody><!-- Dados via JS --></tbody>
        </table>
    </div>

    <!-- Segunda Rodada -->
    <div class="card">
        <h2>Segunda Rodada</h2>
        <div class="aviso">Mande no privado do @walisontm até 12h59 da quinta 18/06</div>
        <div id="lista-r2"></div>
    </div>

    <!-- Resultados Rodada 1 -->
    <div class="card">
        <h2>Resultados - Rodada 1</h2>
        <div id="lista-r1"></div>
    </div>
</div>

<script>
    const jogosR2 = [
        "República Tcheca x África do Sul", "Suíça x Bósnia e Herzegovina", "Canadá x Catar", 
        "México x Coreia do Sul", "EUA x Austrália", "Escócia x Marrocos", "Brasil x Haiti", 
        "Turquia x Paraguai", "Países Baixos x Suécia", "Alemanha x Costa do Marfim", 
        "Equador x Curaçao", "Tunísia x Japão", "Espanha x Arábia Saudita", "Bélgica x Irã", 
        "Uruguai x Cabo Verde", "Nova Zelândia x Egito", "Argentina x Áustria", 
        "França x Iraque", "Noruega x Senegal", "Jordânia x Argélia", "Portugal x Uzbequistão", 
        "Inglaterra x Gana", "Panamá x Croácia", "Colômbia x R. D. Congo"
    ];

    function carregarDados() {
        const divR2 = document.getElementById("lista-r2");
        jogosR2.forEach(jogo => {
            divR2.innerHTML += `<div class="jogo-linha"><span>${jogo}</span></div>`;
        });
    }
    carregarDados();
</script>

</body>
</html>
