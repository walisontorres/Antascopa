function renderizarJogos(){const container=document.getElementById("lista-jogos-principal");const jogos=rodadaAtual===1?jogosR1:jogosR2;let html="";jogos.forEach(t=>{const resA=resultadosFinais[t.idA]||"-";const resB=resultadosFinais[t.idB]||"-";html+=`<div class="jogo-card"><div class="jogo-principal"><div class="time-container casa"><span>${t.tA}</span><span class="bandeira">${t.bA}</span></div><div class="placar-container"><div class="placar-wrapper"><div class="placar-box">${resA}</div><span class="divisor">X</span><div class="placar-box">${resB}</div></div></div><div class="time-container fora"><span class="bandeira">${t.bB}</span><span>${t.tB}</span></div></div><div class="jogo-odds">ODDS: ${t.o}</div></div>`});container.innerHTML=html}
function abrirPalpites(e, rodada=1) {
    document.getElementById("modal-titulo").innerText = `Palpites de ${e}`;
    const t = dadosPalpites[e];
    const jogos = rodada === 1 ? jogosR1 : jogosR2;
    let html = `
        <div class="tab-container" style="justify-content:center">
            <button class="tab-btn ${rodada===1?'active':''}" onclick="abrirPalpites('${e}',1)">Rodada 1</button>
            <button class="tab-btn ${rodada===2?'active':''}" onclick="abrirPalpites('${e}',2)">Rodada 2</button>
        </div>
        <div class="jogos-lista">`;

    jogos.forEach((jogo) => {
        const idA = jogo.idA;
        const idB = jogo.idB;
        const pA = t[idA] || "-";
        const pB = t[idB] || "-";
        
        let ptsJogo = 0;
        const resA = parseInt(resultadosFinais[idA]);
        const resB = parseInt(resultadosFinais[idB]);
        const palA = parseInt(pA);
        const palB = parseInt(pB);

        if (!isNaN(resA) && !isNaN(resB) && !isNaN(palA) && !isNaN(palB)) {
            if (resA === palA && resB === palB) ptsJogo = 10;
            else if ((resA - resB) === (palA - palB) && ((resA > resB && palA > palB) || (resB > resA && palB > palA))) ptsJogo = 6;
            else if ((resA - resB) === 0 && (palA - palB) === 0) ptsJogo = 5;
            else if ((resA > resB && palA > palB) || (resB > resA && palB > palA)) ptsJogo = 3;
        }

        html += `
        <div class="jogo-card">
            <div style="font-size:0.75rem; font-weight:700; color:var(--primary); margin-bottom:5px; text-align:center; background:rgba(15,81,50,0.05); padding:2px; border-radius:4px;">
                Pontos neste jogo: ${ptsJogo}
            </div>
            <div class="jogo-principal">
                <div class="time-container casa"><span>${jogo.tA}</span><span class="bandeira">${jogo.bA}</span></div>
                <div class="placar-container">
                    <div class="placar-wrapper">
                        <div class="placar-box">${pA}</div>
                        <span class="divisor">X</span>
                        <div class="placar-box">${pB}</div>
                    </div>
                </div>
                <div class="time-container fora"><span class="bandeira">${jogo.bB}</span><span>${jogo.tB}</span></div>
            </div>
        </div>`;
    });
    html += `</div>`;
    document.getElementById("modal-container-interno").innerHTML = html;
    document.getElementById("modal-palpites").classList.add("ativo");
}
function fecharPalpites(){document.getElementById("modal-palpites").classList.remove("ativo")}function fecharModalExterno(e){"modal-palpites"===e.target.id&&fecharPalpites()}
function atualizarClassificacao(){let e=[];Object.keys(dadosPalpites).forEach(t=>{let a=0,l=dadosPalpites[t];jogosR1.forEach(e=>{let t=resultadosFinais[e.idA],n=resultadosFinais[e.idB],r=l[e.idA],o=l[e.idB];if(t&&n&&r&&o){let s=parseInt(t),i=parseInt(n),c=parseInt(r),d=parseInt(o);if(s===c&&i===d)a+=10;else if((s-i)===(c-d)&&((s>i&&c>d)||(i>s&&d>c)))a+=6;else if((s-i)===0&&(c-d)===0)a+=5;else if((s>i&&c>d)||(i>s&&d>c))a+=3}});jogosR2.forEach(e=>{let t=resultadosFinais[e.idA],n=resultadosFinais[e.idB],r=l[e.idA],o=l[e.idB];if(t&&n&&r&&o){let s=parseInt(t),i=parseInt(n),c=parseInt(r),d=parseInt(o);if(s===c&&i===d)a+=10;else if((s-i)===(c-d)&&((s>i&&c>d)||(i>s&&d>c)))a+=6;else if((s-i)===0&&(c-d)===0)a+=5;else if((s>i&&c>d)||(i>s&&d>c))a+=3}});e.push({nome:t,pontos:a})});e.sort((e,t)=>t.pontos-e.pontos);let t="";e.forEach((e,a)=>{t+=`<tr><td style="font-weight:700;padding-left:25px">${a+1}º</td><td style="font-weight:600">${e.nome}</td><td style="text-align:center;font-weight:700;color:var(--primary)">${e.pontos}</td></tr>`});document.getElementById("tabela-ranking").innerHTML=t;salvarERenderizarEvolucao(e);gerarNoticias(e);let p="";Object.keys(dadosPalpites).forEach(n=>{p+=`<div class="part-item"><span class="part-nome">${n}</span><button class="btn-palpites" onclick="abrirPalpites('${n}')">Ver Palpites</button></div>`});document.getElementById("lista-participantes").innerHTML=p}
function gerarNoticias(ranking){const container=document.getElementById("news-container");const topo=ranking[0];container.innerHTML=`<div class="news-card"><span class="news-tag">RESULTADO</span><h3 class="news-title">Portugal e Congo empatam em 1x1.</h3><p class="news-text">Pontuações atualizadas.</p></div><div class="news-card"><span class="news-tag">LÍDER</span><h3 class="news-title">${topo.nome} na liderança!</h3><p class="news-text">Com ${topo.pontos} pontos.</p></div>`}
function salvarERenderizarEvolucao(e){let t=JSON.parse(localStorage.getItem("bolao_posicoes_anteriores")||"{}"),a=!t||0===Object.keys(t).length,l={},n=e[0].pontos||1;let r="";e.forEach((e,o)=>{let s=o+1;l[e.nome]=s;let i="-",c="manteve";if(!a&&t[e.nome]){let d=t[e.nome];if(s<d){i="▲";c="subiu"}else if(s>d){i="▼";c="desceu"}}let d=e.pontos/n*100;r+=`<div class="evolucao-linha"><span class="evolucao-nome">${e.nome}</span><div class="evolucao-barra-bg"><div class="evolucao-barra-fill" style="width:${Math.max(5,d)}%"></div></div><span class="evolucao-pts">${e.pontos} pts</span><span class="evolucao-tendencia ${c}">${i}</span></div>`});localStorage.setItem("bolao_posicoes_anteriores",JSON.stringify(l));document.getElementById("painel-evolucao").innerHTML=r}
renderizarPorRodada(1);atualizarClassificacao();</script></body></html>
