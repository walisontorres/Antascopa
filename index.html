<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolão Copa do Mundo - Antas</title>
    <style>
        :root { --primary: #0f5132; --bg: #f3f7f5; }
        body { font-family: sans-serif; background-color: var(--bg); padding: 20px; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        .jogos-lista { display: none; }
        .jogos-lista.ativo { display: block; }
        .btn-tab { padding: 10px; cursor: pointer; border: none; background: #eee; }
        .btn-tab.ativo { background: var(--primary); color: white; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal.ativo { display: flex; align-items: center; justify-content: center; }
        .modal-conteudo { background: white; padding: 20px; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; }
    </style>
</head>
<body>

<div style="margin-bottom: 20px;">
    <button class="btn-tab ativo" onclick="mostrarRodada(1, this)">Rodada 1</button>
    <button class="btn-tab" onclick="mostrarRodada(2, this)">Rodada 2</button>
</div>

<div id="lista-r1" class="jogos-lista ativo">
    <table><thead><tr><th>Jogo</th></tr></thead><tbody id="corpo-r1"></tbody></table>
</div>

<div id="lista-r2" class="jogos-lista">
    <table><thead><tr><th>Jogo</th></tr></thead><tbody id="corpo-r2"></tbody></table>
</div>

<button onclick="abrirModal()">Ver Palpites</button>

<div id="modal-palpites" class="modal">
    <div class="modal-conteudo">
        <button class="btn-tab ativo" id="btn-m1" onclick="atualizarModal(1)">R1</button>
        <button class="btn-tab" id="btn-m2" onclick="atualizarModal(2)">R2</button>
        <div id="conteudo-modal"></div>
        <button onclick="document.getElementById('modal-palpites').classList.remove('ativo')">Fechar</button>
    </div>
</div>

<script>
    const R1 = [{tA: "Time A", tB: "Time B"}]; // Preencha aqui
    const R2 = [
        {tA: "Rep. Tcheca", tB: "África do Sul"}, {tA: "Suíça", tB: "Bósnia"},
        {tA: "Canadá", tB: "Catar"}, {tA: "México", tB: "Coreia do Sul"},
        {tA: "EUA", tB: "Austrália"}, {tA: "Escócia", tB: "Marrocos"},
        {tA: "Brasil", tB: "Haiti"}, {tA: "Turquia", tB: "Paraguai"},
        {tA: "Países Baixos", tB: "Suécia"}, {tA: "Alemanha", tB: "Costa do Marfim"},
        {tA: "Equador", tB: "Curaçao"}, {tA: "Tunísia", tB: "Japão"},
        {tA: "Espanha", tB: "Arábia Saudita"}, {tA: "Bélgica", tB: "Irã"},
        {tA: "Uruguai", tB: "Cabo Verde"}, {tA: "Nova Zelândia", tB: "Egito"},
        {tA: "Argentina", tB: "Áustria"}, {tA: "França", tB: "Iraque"},
        {tA: "Noruega", tB: "Senegal"}, {tA: "Jordânia", tB: "Argélia"},
        {tA: "Portugal", tB: "Uzbequistão"}, {tA: "Inglaterra", tB: "Gana"},
        {tA: "Panamá", tB: "Croácia"}, {tA: "Colômbia", tB: "R. D. Congo"}
    ];

    function renderizarTabela(lista, idCorpo) {
        document.getElementById(idCorpo).innerHTML = lista.map(j => `<tr><td>${j.tA} X ${j.tB}</td></tr>`).join('');
    }

    function mostrarRodada(n, btn) {
        document.querySelectorAll('.jogos-lista').forEach(el => el.classList.remove('ativo'));
        document.querySelectorAll('.btn-tab').forEach(el => el.classList.remove('ativo'));
        document.getElementById('lista-r' + n).classList.add('ativo');
        btn.classList.add('ativo');
    }

    function abrirModal() {
        document.getElementById('modal-palpites').classList.add('ativo');
        atualizarModal(1);
    }

    function atualizarModal(n) {
        const lista = n === 1 ? R1 : R2;
        document.getElementById('conteudo-modal').innerHTML = `<table>${lista.map(j => `<tr><td>${j.tA} X ${j.tB}</td></tr>`).join('')}</table>`;
        document.getElementById('btn-m1').className = n === 1 ? 'btn-tab ativo' : 'btn-tab';
        document.getElementById('btn-m2').className = n === 2 ? 'btn-tab ativo' : 'btn-tab';
    }

    renderizarTabela(R1, 'corpo-r1');
    renderizarTabela(R2, 'corpo-r2');
</script>

</body>
</html>
