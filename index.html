function calcularPontos(palpiteA, palpiteB, realA, realB) {
    if (realA === undefined || realB === undefined || realA === null || realB === null || realA === "-" || realB === "-") return 0;
    const pA = parseInt(palpiteA), pB = parseInt(palpiteB), rA = parseInt(realA), rB = parseInt(realB);
    if (isNaN(pA) || isNaN(pB) || isNaN(rA) || isNaN(rB)) return 0;
    if (pA === rA && pB === rB) return 5;
    const saldoP = pA - pB, saldoR = rA - rB;
    if ((saldoP > 0 && saldoR > 0) || (saldoP < 0 && saldoR < 0) || (saldoP === 0 && saldoR === 0)) {
        if (saldoP === saldoR) return 3;
        return 2;
    }
    return 0;
}

function calcularEstatisticasParticipante(p) {
    let pts = 0, cheios = 0, saldos = 0, tendencia = 0;
    let ptsR1 = 0, ptsR2 = 0;
    jogosR1.forEach(j => {
        const pt = calcularPontos(p.palpites[j.idA], p.palpites[j.idB], resultadosFinais[j.idA], resultadosFinais[j.idB]);
        pts += pt; ptsR1 += pt; if (pt === 5) cheios++; if (pt === 3) saldos++; if (pt > 0) tendencia++;
    });
    jogosR2.forEach(j => {
        const pt = calcularPontos(p.palpites[j.idA], p.palpites[j.idB], resultadosFinais[j.idA], resultadosFinais[j.idB]);
        pts += pt; ptsR2 += pt; if (pt === 5) cheios++; if (pt === 3) saldos++; if (pt > 0) tendencia++;
    });
    jogosR3.forEach(j => {
        const pt = calcularPontos(p.palpites[j.idA], p.palpites[j.idB], resultadosFinais[j.idA], resultadosFinais[j.idB]);
        pts += pt; if (pt === 5) cheios++; if (pt === 3) saldos++; if (pt > 0) tendencia++;
    });
    return { nome: p.nome, pontos: pts, cheios, saldos, tendencia, r1: ptsR1, r2: ptsR2 };
}

function atualizarClassificacao() {
    const listaGeral = dadosPalpites.map(p => calcularEstatisticasParticipante(p));
    listaGeral.sort((a, b) => {
        if (b.pontos !== a.pontos) return b.pontos - a.pontos;
        if (b.cheios !== a.cheios) return b.cheios - a.cheios;
        return b.saldos - a.saldos;
    });

    const tbody = document.getElementById("tabela-ranking");
    tbody.innerHTML = "";
    listaGeral.forEach((p, idx) => {
        let medalha = (idx + 1) + "º";
        if (idx === 0) medalha = "🥇";
        else if (idx === 1) medalha = "🥈";
        else if (idx === 2) medalha = "🥉";
        tbody.innerHTML += `<tr><td><strong>${medalha}</strong></td><td><strong>${p.nome}</strong></td><td style="text-align:center;font-weight:800;color:var(--primary)">${p.pontos}</td></tr>`;
    });

    const totalPontosGrupo = listaGeral.reduce((acc, curr) => acc + curr.pontos, 0);
    const lider = listaGeral[0] ? listaGeral[0].nome : "-";
    const recordeCheios = [...listaGeral].sort((a, b) => b.cheios - a.cheios)[0];
    const mestrePlacar = recordeCheios ? `${recordeCheios.nome} (${recordeCheios.cheios}🏆)` : "-";

    document.getElementById("stats-container").innerHTML = `
        <div class="stat-card"><span class="stat-value">${totalPontosGrupo}</span><span class="stat-label">Pontos Coletivos</span></div>
        <div class="stat-card"><span class="stat-value" style="color:#1c2421">${lider}</span><span class="stat-label">Líder Atual</span></div>

    `;

    const piorLanterna = [...listaGeral].reverse()[0];
    document.getElementById("estatisticas-dinamicas").innerHTML = `
        <div class="news-card" style="border-color:#ffc107">
            <div class="news-title">Fatos do Grupo dos Antas</div>
            <p class="news-text">Até o momento, o grupo já cravou um total combinado de <strong>${listaGeral.reduce((a, b) => a + b.cheios, 0)}</strong> placares perfeitos. Quem está segurando a lanterna com muito orgulho é o parceiro <strong>${piorLanterna ? piorLanterna.nome : "-"}</strong>.</p>
        </div>
    `;

    const rankingR1 = [...listaGeral].sort((a, b) => b.r1 - a.r1);
    const evolucaoContainer = document.getElementById("painel-evolucao");
    evolucaoContainer.innerHTML = "";
    
    listaGeral.forEach(p => {
        const idxR1 = rankingR1.findIndex(x => x.nome === p.nome);
        const idxGeral = listaGeral.findIndex(x => x.nome === p.nome);
        let trendHtml = '<span class="evolucao-tendencia manteve">● 0</span>';
        if (idxR1 > idxGeral) trendHtml = `<span class="evolucao-tendencia subiu">▲ +${idxR1 - idxGeral}</span>`;
        else if (idxR1 < idxGeral) trendHtml = `<span class="evolucao-tendencia desceu">▼ -${idxGeral - idxR1}</span>`;

        const maxPts = listaGeral[0] ? listaGeral[0].pontos : 1;
        const pct = (p.pontos / maxPts) * 100;

        evolucaoContainer.innerHTML += `
            <div class="evolucao-linha">
                <span class="evolucao-nome">${p.nome}</span>
                <div class="evolucao-barra-bg"><div class="evolucao-barra-fill" style="width: ${pct}%"></div></div>
                <span class="evolucao-pts">${p.pontos} pts</span>

function calcularOddsJogo(idA, idB) {
    let vA = 0, emp = 0, vB = 0;
    dadosPalpites.forEach(p => {
        const pA = p.palpites[idA], pB = p.palpites[idB];
        if (pA !== undefined && pB !== undefined) {
            if (pA > pB) vA++;
            else if (pA < pB) vB++;
            else emp++;
        }
    });
    const total = vA + emp + vB;
    if (total === 0) return "Sem palpites cadastrados";
    const pctA = Math.round((vA / total) * 100);
    const pctEmp = Math.round((emp / total) * 100);
    const pctB = Math.round((vB / total) * 100);
    return `Tendência do Grupo: Casa ${pctA}% | Empate ${pctEmp}% | Fora ${pctB}%`;
}

    interno.innerHTML = html;
    document.getElementById("modal-palpites").classList.add("ativo");
}

function fecharPalpites() { document.getElementById("modal-palpites").classList.remove("ativo"); }
function fecharModalExterno(e) { if (e.target.id === "modal-palpites") fecharPalpites(); }
