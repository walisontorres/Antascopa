<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Bolão Copa do Mundo - Antas</title>
    <style>:root { --primary: #0f5132; --primary-dark: #082e1c; --accent: #ffc107; --bg: #f3f7f5; --surface: #ffffff; --text: #1c2421; --text-muted: #606f69; --border: rgba(15,81,50,0.08); --radius: 24px; --radius-sm: 14px; --shadow: 0 20px 40px rgba(15,81,50,0.04) } * { box-sizing: border-box; margin: 0; padding: 0 } body { font-family: 'Plus Jakarta Sans',sans-serif; background-color: var(--bg); color: var(--text); line-height: 1.6; padding-bottom: 80px } header { background: linear-gradient(135deg,var(--primary-dark) 0%,var(--primary) 100%); color: #fff; text-align: center; padding: 60px 20px 80px 20px; border-radius: 0 0 var(--radius) var(--radius); position: relative } header h1 { font-size: 2.6rem; font-weight: 700; letter-spacing: -1.5px; margin-bottom: 10px } .container { max-width: 880px; margin: -40px auto 0 auto; padding: 0 16px; position: relative; z-index: 10 } .card { background: var(--surface); padding: 30px 20px; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 35px; border: 1px solid var(--border) } h2 { font-size: 1.5rem; font-weight: 700; color: var(--primary-dark); margin-bottom: 25px } .ranking-table { width: 100%; border-collapse: collapse } .ranking-table th, .ranking-table td { padding: 18px; border-bottom: 1px solid var(--border); text-align: left } .btn-palpites { background: var(--primary); color: #fff; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer } .jogo-card { display: flex; align-items: center; justify-content: space-between; padding: 16px; background: rgba(0,0,0,0.02); margin-bottom: 10px; border-radius: 12px } .placar { font-weight: 800; background: #eee; padding: 5px 10px; border-radius: 6px } .tab-container { display: flex; gap: 10px; margin-bottom: 20px } .tab-btn { padding: 8px 16px; border-radius: 20px; border: 1px solid var(--primary); background: transparent; cursor: pointer; color: var(--primary) } .tab-btn.active { background: var(--primary); color: #fff } .modal { display: none; position: fixed; top:0; left:0; width: 100%; height:100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center } .modal.active { display: flex } .modal-content { background: white; padding: 25px; border-radius: 20px; max-width: 500px; width: 90% } </style>
</head>
<body>
<header><h1>Bolão Copa do Mundo</h1><p>Grupo Oficial: Os Antas 🐗</p></header>
<div class="container">
    <div class="card">
        <h2>Classificação</h2>
        <table class="ranking-table"><tbody id="tabela-ranking"></tbody></table>
    </div>
    <div class="card">
        <div class="tab-container">
            <button class="tab-btn active" id="btnR1" onclick="renderizarJogos(1)">R1</button>
            <button class="tab-btn" id="btnR2" onclick="renderizarJogos(2)">R2</button>
            <button class="tab-btn" id="btnR3" onclick="renderizarJogos(3)">R3</button>
        </div>
        <div id="lista-jogos"></div>
    </div>
</div>

<div id="modal" class="modal"><div class="modal-content"><button onclick="document.getElementById('modal').classList.remove('active')">Fechar</button><h3 id="modal-titulo"></h3><div id="conteudo-palpites"></div></div></div>

<script>
const participantes = ["Walishow", "Paulão", "Gu", "Okc Freitas", "Fish", "Psico", "Sid", "Lucas", "Wix", "Julian", "soltin", "Samuel", "Abner"];
const jogosR1 = [{tA:"México",tB:"África do Sul",rA:1,rB:0},{tA:"Brasil",tB:"Marrocos",rA:2,rB:1}]; // Exemplos de resultados
const jogosR2 = [{tA:"Suíça",tB:"Bósnia",rA:0,rB:0},{tA:"Brasil",tB:"Haiti",rA:3,rB:0}];
const jogosR3 = [{tA:"Suíça",tB:"Canadá",rA:"-",rB:"-"},{tA:"Bósnia",tB:"Catar",rA:"-",rB:"-"},{tA:"Escócia",tB:"Brasil",rA:"-",rB:"-"}];

function renderizarJogos(n) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`btnR${n}`).classList.add('active');
    const jogos = n === 1 ? jogosR1 : (n === 2 ? jogosR2 : jogosR3);
    document.getElementById("lista-jogos").innerHTML = jogos.map(j => `
        <div class="jogo-card">
            <span>${j.tA}</span>
            <span class="placar">${j.rA} X ${j.rB}</span>
            <span>${j.tB}</span>
        </div>
    `).join('');
}

window.onload = () => {
    renderizarJogos(1);
    document.getElementById("tabela-ranking").innerHTML = participantes.map((p,i) => `
        <tr><td>${i+1}º</td><td>${p}</td><td><button class="btn-palpites" onclick="verPalpite('${p}')">Palpites</button></td></tr>
    `).join('');
};

function verPalpite(nome) {
    document.getElementById("modal-titulo").innerText = "Palpites de " + nome;
    document.getElementById("conteudo-palpites").innerHTML = "<p>Palpite registrado: Brasil 2x1 Marrocos (Exemplo)</p>";
    document.getElementById("modal").classList.add("active");
}
</script>
</body>
</html>
