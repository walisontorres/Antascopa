<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bolão Copa do Mundo - Antas</title><style>:root { --primary: #0f5132; --primary-dark: #082e1c; --accent: #ffc107; --bg: #f3f7f5; --surface: #ffffff; --text: #1c2421; --text-muted: #606f69; --border: rgba(15,81,50,0.08); --radius: 24px; --radius-sm: 14px; --shadow: 0 20px 40px rgba(15,81,50,0.04) } * { box-sizing: border-box; margin: 0; padding: 0 } body { font-family: 'Plus Jakarta Sans',sans-serif; background-color: var(--bg); color: var(--text); line-height: 1.6; padding-bottom: 80px } header { background: linear-gradient(135deg,var(--primary-dark) 0%,var(--primary) 100%); color: #fff; text-align: center; padding: 60px 20px 80px 20px; border-radius: 0 0 var(--radius) var(--radius); position: relative } header h1 { font-size: 2.6rem; font-weight: 700; letter-spacing: -1.5px; margin-bottom: 10px } header p { font-size: 1.1rem; opacity: .85; font-weight: 500; background: rgba(255,255,255,0.1); padding: 6px 16px; border-radius: 100px; display: inline-block } .container { max-width: 880px; margin: -40px auto 0 auto; padding: 0 16px; position: relative; z-index: 10 } .card { background: var(--surface); padding: 30px 20px; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 35px; border: 1px solid var(--border) } h2 { font-size: 1.5rem; font-weight: 700; color: var(--primary-dark); margin-bottom: 25px; letter-spacing: -0.5px } .table-container { overflow-x: auto } .ranking-table { width: 100%; border-collapse: collapse; text-align: left } .ranking-table th { background-color: rgba(15,81,50,0.04); color: var(--text-muted); font-weight: 600; padding: 18px; font-size: .9rem; text-transform: uppercase; letter-spacing: 1px; border-radius: var(--radius-sm) var(--radius-sm) 0 0 } .ranking-table td { padding: 18px; border-bottom: 1px solid var(--border); font-size: 1rem } .part-lista { display: flex; flex-direction: column; gap: 15px } .part-item { display: flex; align-items: center; padding: 20px 25px; background: rgba(15,81,50,0.02); border: 1px solid var(--border); border-radius: var(--radius-sm); justify-content: space-between } .btn-palpites { background: linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%); color: #fff; border: none; padding: 10px 22px; border-radius: 100px; font-weight: 600; cursor: pointer } .abas-jogos { display: flex; gap: 10px; margin-bottom: 20px } .btn-aba { background: rgba(15,81,50,0.05); border: 1px solid var(--border); padding: 10px 20px; border-radius: 100px; cursor: pointer; font-weight: 600; color: var(--primary) } .btn-aba.ativo { background: var(--primary); color: #fff } .jogos-lista { display: none; flex-direction: column; gap: 18px } .jogos-lista.ativo { display: flex } .jogo-card { display: flex; flex-direction: column; padding: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); gap: 12px } .jogo-principal { display: flex; align-items: center; justify-content: space-between; gap: 8px } .placar-wrapper { display: flex; align-items: center; gap: 10px } .placar-box { width: 35px; height: 35px; background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700 } .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center } .modal.ativo { display: flex } .modal-conteudo { background: #fff; padding: 20px; border-radius: 20px; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto } </style></head><body>
<header><h1>Bolão Copa do Mundo</h1><p>Grupo Oficial: Os Antas 🐗</p></header>
<div class="container">
    <div class="card"><h2>Classificação Geral</h2><table class="ranking-table"><tbody id="tabela-ranking"></tbody></table></div>
    <div class="card"><h2>Participantes</h2><div class="part-lista" id="lista-participantes"></div></div>
    <div class="card"><h2>Jogos</h2>
        <div class="abas-jogos">
            <button class="btn-aba ativo" onclick="alternarAba('lista-r1', this)">Primeira Rodada</button>
            <button class="btn-aba" onclick="alternarAba('lista-r2', this)">Segunda Rodada</button>
        </div>
        <div class="jogos-lista ativo" id="lista-r1"></div>
        <div class="jogos-lista" id="lista-r2"></div>
    </div>
</div>
<div id="modal-palpites" class="modal"><div class="modal-conteudo"><h3 id="modal-titulo">Palpites</h3><div id="modal-lista-jogos"></div><button onclick="fecharPalpites()" style="margin-top:15px">Fechar</button></div></div>
<script>
const participantes = ["Walishow", "Paulão", "Campeão de 2026 Okc Freitas", "Fish", "Psico", "Sid", "Lucas", "Gu", "Wix", "Julian", "soltin", "Samuel", "Abner"];
const estruturaJogos = [{idA:'bra',tA:'Brasil',bA:'🇧🇷',idB:'cro',tB:'Croácia',bB:'🇭🇷'}];
const estruturaJogosR2 = [{idA:'bra2',tA:'Brasil',bA:'🇧🇷',idB:'arg',tB:'Argentina',bB:'🇦🇷'}];

// Simulação de dados armazenados (Histórico Completo)
const dadosPalpites = {}; 
participantes.forEach(p => { dadosPalpites[p] = {bra: '2', cro: '0', bra2: '1', arg: '1'}; });
const resultadosFinais = {bra: '2', cro: '0', bra2: '1', arg: '1'};

function alternarAba(id, btn) {
    document.querySelectorAll('.jogos-lista').forEach(el => el.classList.remove('ativo'));
    document.querySelectorAll('.btn-aba').forEach(el => el.classList.remove('ativo'));
    document.getElementById(id).classList.add('ativo');
    btn.classList.add('ativo');
}

function renderizarJogos(id, lista, res) {
    let html = lista.map(j => `
        <div class="jogo-card">
            <div class="jogo-principal">
                <div>${j.bA} ${j.tA}</div>
                <div class="placar-wrapper"><div class="placar-box">${res[j.idA]||'-'}</div>X<div class="placar-box">${res[j.idB]||'-'}</div></div>
                <div>${j.tB} ${j.bB}</div>
            </div>
        </div>`).join('');
    document.getElementById(id).innerHTML = html;
}

function abrirPalpites(nome) {
    document.getElementById("modal-titulo").innerText = "Palpites de " + nome;
    document.getElementById("modal-lista-jogos").innerHTML = `
        <p>R1: ${dadosPalpites[nome].bra}x${dadosPalpites[nome].cro}</p>
        <p>R2: ${dadosPalpites[nome].bra2}x${dadosPalpites[nome].arg}</p>`;
    document.getElementById("modal-palpites").classList.add("ativo");
}

function fecharPalpites() { document.getElementById("modal-palpites").classList.remove("ativo"); }

function atualizarUI() {
    document.getElementById("lista-participantes").innerHTML = participantes.map(p => `
        <div class="part-item"><span>${p}</span><button class="btn-palpites" onclick="abrirPalpites('${p}')">Ver</button></div>`).join('');
    renderizarJogos('lista-r1', estruturaJogos, resultadosFinais);
    renderizarJogos('lista-r2', estruturaJogosR2, resultadosFinais);
}

atualizarUI();
</script></body></html>
