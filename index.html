<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Bolão Copa do Mundo - Antas</title>
    <style>
        :root { --primary: #0f5132; --primary-dark: #082e1c; --accent: #ffc107; --bg: #f3f7f5; --surface: #ffffff; --text: #1c2421; --text-muted: #606f69; --border: rgba(15,81,50,0.08); --radius: 24px; --radius-sm: 14px; --shadow: 0 20px 40px rgba(15,81,50,0.04) } 
        * { box-sizing: border-box; margin: 0; padding: 0 } 
        body { font-family: 'Plus Jakarta Sans',sans-serif; background-color: var(--bg); color: var(--text); line-height: 1.6; padding-bottom: 80px } 
        header { background: linear-gradient(135deg,var(--primary-dark) 0%,var(--primary) 100%); color: #fff; text-align: center; padding: 60px 20px 80px 20px; border-radius: 0 0 var(--radius) var(--radius); position: relative } 
        header h1 { font-size: 2.6rem; font-weight: 700; letter-spacing: -1.5px; margin-bottom: 10px } 
        header p { font-size: 1.1rem; opacity: .85; font-weight: 500; background: rgba(255,255,255,0.1); padding: 6px 16px; border-radius: 100px; display: inline-block } 
        .container { max-width: 880px; margin: -40px auto 0 auto; padding: 0 16px; position: relative; z-index: 10 } 
        .card { background: var(--surface); padding: 30px 20px; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 35px; border: 1px solid var(--border) } 
        h2 { font-size: 1.5rem; font-weight: 700; color: var(--primary-dark); margin-bottom: 25px; letter-spacing: -0.5px } 
        .ranking-table { width: 100%; border-collapse: collapse; text-align: left } 
        .ranking-table th { background-color: rgba(15,81,50,0.04); color: var(--text-muted); font-weight: 600; padding: 18px; font-size: .9rem; text-transform: uppercase; letter-spacing: 1px; border-radius: var(--radius-sm) var(--radius-sm) 0 0 } 
        .ranking-table td { padding: 18px; border-bottom: 1px solid var(--border); font-size: 1rem } 
        
        /* Novas Cores de Pontuação */
        .pts-alta { color: #198754; font-weight: 700; }
        .pts-media { color: #fd7e14; font-weight: 700; }
        .pts-baixa { color: #dc3545; font-weight: 700; }

        /* Cores no Modal de Palpites */
        .palpite-exato { border: 2px solid #198754 !important; background: rgba(25, 135, 84, 0.1) !important; color: #198754 !important; }
        .palpite-resultado { border: 2px solid #ffc107 !important; background: rgba(255, 193, 7, 0.1) !important; color: #b38600 !important; }
        .palpite-errado { border: 2px solid #dc3545 !important; background: rgba(220, 53, 69, 0.05) !important; color: #dc3545 !important; }

        .part-lista { display: flex; flex-direction: column; gap: 15px } 
        .part-item { display: flex; align-items: center; padding: 20px 25px; background: rgba(15,81,50,0.02); border: 1px solid var(--border); border-radius: var(--radius-sm); justify-content: space-between; transition: all .3s ease } 
        .part-item:hover { transform: scale(1.01); background: rgba(15,81,50,0.04) } 
        .part-nome { font-weight: 700; font-size: 1.2rem; color: var(--primary-dark) } 
        .btn-palpites { background: linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%); color: #fff; border: none; padding: 10px 22px; border-radius: 100px; font-weight: 600; cursor: pointer; font-family: inherit; font-size: .95rem; box-shadow: 0 10px 20px rgba(15,81,50,0.15); transition: all .3s ease } 
        .btn-palpites:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(15,81,50,0.25) } 
        .jogos-lista { display: flex; flex-direction: column; gap: 18px } 
        .jogo-card { display: flex; flex-direction: column; padding: 16px 12px; background: var(--surface); border-radius: var(--radius-sm); border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.02); transition: all .3s ease; gap: 12px } 
        .jogo-principal { display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 8px } 
        .placar-box { width: 38px; height: 38px; background: rgba(15,81,50,0.03); border: 2px solid var(--border); border-radius: 10px; text-align: center; font-size: 1.1rem; font-weight: 700; color: var(--primary-dark); display: flex; align-items: center; justify-content: center } 
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(8,46,28,0.4); backdrop-filter: blur(8px); z-index: 100; align-items: center; justify-content: center; padding: 16px } 
        .modal.ativo { display: flex } 
        .modal-conteudo { background: var(--surface); padding: 30px 16px; border-radius: var(--radius); max-width: 650px; width: 100%; max-height: 85vh; overflow-y: auto } 
        .tab-btn { padding: 8px 16px; cursor: pointer; border-radius: 20px; border: 1px solid var(--primary); background: transparent; font-weight: 600; color: var(--primary); } 
        .tab-btn.active { background: var(--primary); color: #fff; }
    </style>
</head>
<body>
<header><h1>Bolão Copa do Mundo</h1><p>Grupo Oficial: Os Antas 🐗</p></header>
<div class="container">
    <div class="card"><h2>Classificação Geral</h2><table class="ranking-table"><thead><tr><th>Posição</th><th>Participante</th><th>Points</th></tr></thead><tbody id="tabela-ranking"></tbody></table></div>
    <div class="card"><h2>Painel de Evolução 📈</h2><div id="painel-evolucao"></div></div>
    <div class="card"><h2>Lista de Participantes</h2><div class="part-lista" id="lista-participantes"></div></div>
    <div class="card"><h2>Jogos & Resultados</h2><div class="jogos-lista" id="lista-jogos-principal"></div></div>
</div>

<div id="modal-palpites" class="modal"><div class="modal-conteudo"><button class="modal-fechar" onclick="fecharPalpites()">&times;</button><h2 id="modal-titulo">Palpites</h2><div id="modal-container-interno"></div></div></div>

<script>
/* Mantenha seus dados e constantes aqui */
const dadosPalpites = { /* ... seu objeto de dados ... */ };
const resultadosFinais = { /* ... seu objeto de resultados ... */ };
const jogosR1 = [ /* ... array de jogos ... */ ];

function obterClassePontos(pts) {
    if (pts > 50) return 'pts-alta';
    if (pts > 20) return 'pts-media';
    return 'pts-baixa';
}

function obterClassePalpite(pA, pB, rA, rB) {
    if (pA == rA && pB == rB) return 'palpite-exato';
    let s = parseInt(rA), i = parseInt(rB), c = parseInt(pA), d = parseInt(pB);
    if ((s-i)===(c-d) && ((s>i&&c>d)||(i>s&&d>c))) return 'palpite-resultado';
    if ((s-i)===0 && (c-d)===0) return 'palpite-resultado';
    return 'palpite-errado';
}

function atualizarClassificacao() {
    let ranking = [];
    Object.keys(dadosPalpites).forEach(nome => {
        let pts = 0;
        let palpite = dadosPalpites[nome];
        jogosR1.forEach(j => {
            let rA = resultadosFinais[j.idA], rB = resultadosFinais[j.idB];
            let pA = palpite[j.idA], pB = palpite[j.idB];
            if (rA == pA && rB == pB) pts += 10;
            else if ((rA > rB && pA > pB) || (rB > rA && pB > pA) || (rA == rB && pA == pB)) pts += 3;
        });
        ranking.push({nome, pts});
    });
    ranking.sort((a,b) => b.pts - a.pts);
    
    let html = "";
    ranking.forEach((r, i) => {
        html += `<tr><td>${i+1}º</td><td>${r.nome}</td><td class="${obterClassePontos(r.pts)}">${r.pts}</td></tr>`;
    });
    document.getElementById("tabela-ranking").innerHTML = html;
}

function abrirPalpites(nome) {
    document.getElementById("modal-titulo").innerText = "Palpites de " + nome;
    let palpite = dadosPalpites[nome];
    let html = "";
    jogosR1.forEach(j => {
        let pA = palpite[j.idA], pB = palpite[j.idB];
        let rA = resultadosFinais[j.idA], rB = resultadosFinais[j.idB];
        let cls = obterClassePalpite(pA, pB, rA, rB);
        html += `<div class="jogo-card"><div class="jogo-principal">${j.tA} <div class="placar-box ${cls}">${pA}</div> X <div class="placar-box ${cls}">${pB}</div> ${j.tB}</div></div>`;
    });
    document.getElementById("modal-container-interno").innerHTML = html;
    document.getElementById("modal-palpites").classList.add("ativo");
}

function fecharPalpites() { document.getElementById("modal-palpites").classList.remove("ativo"); }

atualizarClassificacao();
</script>
</body>
</html>
