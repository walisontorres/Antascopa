<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bolão Copa do Mundo - Antas</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--primary:#0f5132;--primary-dark:#082e1c;--accent:#ffc107;--bg:#f3f7f5;--surface:#ffffff;--text:#1c2421;--text-muted:#606f69;--border:rgba(15,81,50,0.08);--radius:24px;--radius-sm:14px;--shadow:0 20px 40px rgba(15,81,50,0.04)}*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Plus Jakarta Sans',sans-serif;background-color:var(--bg);color:var(--text);line-height:1.6;padding-bottom:80px}header{background:linear-gradient(135deg,var(--primary-dark) 0%,var(--primary) 100%);color:#fff;text-align:center;padding:60px 20px 80px 20px;border-radius:0 0 var(--radius) var(--radius);position:relative}header h1{font-size:2.6rem;font-weight:700;letter-spacing:-1.5px;margin-bottom:10px}header p{font-size:1.1rem;opacity:.85;font-weight:500;background:rgba(255,255,255,0.1);padding:6px 16px;border-radius:100px;display:inline-block}.container{max-width:880px;margin:-40px auto 0 auto;padding:0 16px;position:relative;z-index:10}.card{background:var(--surface);padding:30px 20px;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:35px;border:1px solid var(--border)}h2{font-size:1.5rem;font-weight:700;color:var(--primary-dark);margin-bottom:25px;letter-spacing:-0.5px}.table-container{overflow-x:auto}.ranking-table{width:100%;border-collapse:collapse;text-align:left}.ranking-table th{background-color:rgba(15,81,50,0.04);color:var(--text-muted);font-weight:600;padding:18px;font-size:.9rem;text-transform:uppercase;letter-spacing:1px;border-radius:var(--radius-sm) var(--radius-sm) 0 0}.ranking-table td{padding:18px;border-bottom:1px solid var(--border);font-size:1rem}.ranking-table tr:last-child td{border-bottom:none}.sem-dados{text-align:center;color:var(--text-muted);padding:50px 18px!important;font-style:italic}.part-lista{display:flex;flex-direction:column;gap:15px}.part-item{display:flex;align-items:center;padding:20px 25px;background:rgba(15,81,50,0.02);border:1px solid var(--border);border-radius:var(--radius-sm);justify-content:space-between;transition:all .3s ease}.part-item:hover{transform:scale(1.01);background:rgba(15,81,50,0.04)}.part-nome{font-weight:700;font-size:1.2rem;color:var(--primary-dark)}.btn-palpites{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);color:#fff;border:none;padding:10px 22px;border-radius:100px;font-weight:600;cursor:pointer;font-family:inherit;font-size:.95rem;box-shadow:0 10px 20px rgba(15,81,50,0.15);transition:all .3s ease}.btn-palpites:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(15,81,50,0.25)}.jogos-lista{display:flex;flex-direction:column;gap:18px}.jogo-card{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:16px 12px;background:var(--surface);border-radius:var(--radius-sm);border:1px solid var(--border);box-shadow:0 10px 25px rgba(0,0,0,0.02);transition:all .3s cubic-bezier(0.4,0,0.2,1)}.jogo-card:hover{transform:translateY(-4px) scale(1.01);border-color:rgba(15,81,50,0.2);box-shadow:0 20px 35px rgba(15,81,50,0.06)}.time-container{display:flex;align-items:center;gap:8px;font-weight:600;font-size:1rem;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.time-container.casa{justify-content:flex-end;text-align:right}.time-container.fora{justify-content:flex-start;text-align:left}.bandeira{font-size:1.6rem;filter:drop-shadow(0 4px 6px rgba(0,0,0,0.06));flex-shrink:0}.placar-container{display:flex;align-items:center;gap:8px;padding:0 5px}.placar-box{width:42px;height:42px;background:rgba(15,81,50,0.03);border:2px solid var(--border);border-radius:10px;text-align:center;font-size:1.2rem;font-weight:700;color:var(--primary-dark);display:flex;align-items:center;justify-content:center;transition:all .2s}.divisor{font-weight:700;color:rgba(15,81,50,0.3);font-size:.9rem}.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(8,46,28,0.4);backdrop-filter:blur(8px);z-index:100;align-items:center;justify-content:center;padding:16px;transition:all .3s}.modal.ativo{display:flex}.modal-conteudo{background:var(--surface);padding:30px 16px;border-radius:var(--radius);max-width:650px;width:100%;box-shadow:0 30px 60px rgba(8,46,28,0.15);position:relative;animation:modalShow .4s cubic-bezier(0.34,1.56,0.64,1);max-height:85vh;overflow-y:auto;border:1px solid rgba(255,255,255,0.8)}.modal-fechar{position:absolute;top:20px;right:16px;background:rgba(15,81,50,0.05);border:none;font-size:1.3rem;cursor:pointer;color:var(--primary-dark);width:32px;height:32px;border-radius:100px;display:flex;align-items:center;justify-content:center;transition:all .2s}.modal-fechar:hover{background:rgba(15,81,50,0.1);transform:rotate(90deg)}@keyframes modalShow{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}@media (max-width:480px){header h1{font-size:2rem}.time-container{font-size:0.85rem;gap:4px}.bandeira{font-size:1.3rem}.placar-box{width:36px;height:36px;font-size:1.1rem;border-radius:8px}.jogo-card{padding:12px 6px}}</style></head>

function renderizarJogosPrincipais(){let e="";estruturaJogos.forEach(t=>{e+=`<div class="jogo-card"><div class="time-container casa"><span>${t.tA}</span><span class="bandeira">${t.bA}</span></div><div class="placar-container"><div class="placar-box">${resultadosFinais[t.idA]}</div><span class="divisor">X</span><div class="placar-box">${resultadosFinais[t.idB]}</div></div><div class="time-container fora"><span class="bandeira">${t.bB}</span><span>${t.tB}</span></div></div>`}),document.getElementById("lista-jogos-principal").innerHTML=e}
