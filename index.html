<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bolão Copa do Mundo - Antas</title>
    <style>:root { --primary: #0f5132; --primary-dark: #082e1c; --accent: #ffc107; --bg: #f3f7f5; --surface: #ffffff; --text: #1c2421; --text-muted: #606f69; --border: rgba(15,81,50,0.08); --radius: 24px; --radius-sm: 14px; --shadow: 0 20px 40px rgba(15,81,50,0.04) } * { box-sizing: border-box; margin: 0; padding: 0 } body { font-family: 'Plus Jakarta Sans',sans-serif; background-color: var(--bg); color: var(--text); padding-bottom: 80px } header { background: linear-gradient(135deg,var(--primary-dark) 0%,var(--primary) 100%); color: #fff; text-align: center; padding: 60px 20px 80px 20px; border-radius: 0 0 var(--radius) var(--radius) } .container { max-width: 880px; margin: -40px auto 0 auto; padding: 0 16px } .tabs { display: flex; gap: 10px; margin-bottom: 25px; justify-content: center; } .tab-btn { padding: 10px 25px; border: none; border-radius: 100px; cursor: pointer; font-weight: 700; background: #e0e0e0; transition: .3s; } .tab-btn.active { background: var(--primary); color: white; } .card { background: var(--surface); padding: 30px 20px; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 35px; border: 1px solid var(--border) } .ranking-table { width: 100%; border-collapse: collapse; } .ranking-table th, .ranking-table td { padding: 18px; border-bottom: 1px solid var(--border); text-align: left } .jogo-card { display: flex; flex-direction: column; padding: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 12px; gap: 10px } .jogo-principal { display: flex; justify-content: space-between; align-items: center } .placar-wrapper { display: flex; align-items: center; gap: 8px } .placar-box { width: 35px; height: 35px; background: #f8f9fa; border: 1px solid #dee2e6; display: flex; align-items: center; justify-content: center; font-weight: 700; border-radius: 8px } .jogo-odds { font-size: 0.65rem; color: #666; text-align: center; background: #f0f0f0; padding: 2px 8px; border-radius: 10px; margin-top: 5px }</style>
</head>
<body>
<header><h1>Bolão Copa do Mundo</h1><p>Grupo Oficial: Os Antas 🐗</p></header>
<div class="container">
    <div class="card">
        <h2>Classificação Geral</h2>
        <table class="ranking-table"><tbody id="tabela-ranking"></tbody></table>
    </div>
    
    <div class="tabs">
        <button id="btn1" class="tab-btn active" onclick="renderizar(1)">Rodada 1</button>
        <button id="btn2" class="tab-btn" onclick="renderizar(2)">Rodada 2</button>
    </div>

    <div class="card">
        <h2 id="titulo-rodada">Jogos</h2>
        <div id="lista-jogos"></div>
    </div>
</div>

<script>
const dadosPalpites = { "Walishow": { j1_a: "2", j1_b: "0" /* ... mantido igual ao original ... */ } };
const resultadosR1 = { j1_a:"2",j1_b:"0",j2_a:"2",j2_b:"1" /* ... seus resultados ... */ };

const jogosR1 = [{tA:"México", bA:"🇲🇽", tB:"África do Sul", bB:"🇿🇦", idA:"j1_a", idB:"j1_b"}];
const jogosR2 = [{tA:"Rep. Tcheca", bA:"🇨🇿", tB:"África do Sul", bB:"🇿🇦"}];

function calcularOdds() {
    return "1 1.85 | X 3.20 | 2 1.85";
}

function renderizar(rodada) {
    document.getElementById('btn1').className = rodada === 1 ? 'tab-btn active' : 'tab-btn';
    document.getElementById('btn2').className = rodada === 2 ? 'tab-btn active' : 'tab-btn';
    
    const lista = document.getElementById("lista-jogos");
    lista.innerHTML = "";
    const jogos = rodada === 1 ? jogosR1 : jogosR2;
    const res = rodada === 1 ? resultadosR1 : {};

    jogos.forEach(j => {
        const valA = res[j.idA] || "-";
        const valB = res[j.idB] || "-";
        lista.innerHTML += `
            <div class="jogo-card">
                <div class="jogo-principal">
                    <div>${j.bA} ${j.tA}</div>
                    <div class="placar-wrapper">
                        <div class="placar-box">${valA}</div>
                        <span>X</span>
                        <div class="placar-box">${valB}</div>
                    </div>
                    <div>${j.tB} ${j.bB}</div>
                </div>
                <div class="jogo-odds">${calcularOdds()}</div>
            </div>`;
    });
}

// Inicialização
renderizar(1);
</script>
</body>
</html>
