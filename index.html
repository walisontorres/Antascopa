<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bolão Copa do Mundo - Antas</title><style>:root { --primary: #0f5132; --primary-dark: #082e1c; --accent: #ffc107; --bg: #f3f7f5; --surface: #ffffff; --text: #1c2421; --text-muted: #606f69; --border: rgba(15,81,50,0.08); --radius: 24px; --radius-sm: 14px; --shadow: 0 20px 40px rgba(15,81,50,0.04) } * { box-sizing: border-box; margin: 0; padding: 0 } body { font-family: 'Plus Jakarta Sans',sans-serif; background-color: var(--bg); color: var(--text); line-height: 1.6; padding-bottom: 80px } header { background: linear-gradient(135deg,var(--primary-dark) 0%,var(--primary) 100%); color: #fff; text-align: center; padding: 60px 20px 80px 20px; border-radius: 0 0 var(--radius) var(--radius); position: relative } .container { max-width: 880px; margin: -40px auto 0 auto; padding: 0 16px; position: relative; z-index: 10 } .card { background: var(--surface); padding: 30px 20px; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 35px; border: 1px solid var(--border) } .ranking-table { width: 100%; border-collapse: collapse } .ranking-table td { padding: 18px; border-bottom: 1px solid var(--border) } .btn-palpites { background: var(--primary); color: #fff; border: none; padding: 10px 22px; border-radius: 100px; font-weight: 600; cursor: pointer; margin: 5px } .nav-rodadas { display: flex; gap: 10px; margin-bottom: 25px; justify-content: center } .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(8,46,28,0.4); backdrop-filter: blur(8px); z-index: 100; align-items: center; justify-content: center; padding: 16px } .modal.ativo { display: flex } .modal-conteudo { background: var(--surface); padding: 30px; border-radius: var(--radius); max-width: 650px; width: 100%; max-height: 85vh; overflow-y: auto } .modal-fechar { cursor: pointer; float: right; font-size: 1.5rem; border: none; background: none } </style></head><body><header><h1>Bolão Copa do Mundo</h1><p>Grupo Oficial: Os Antas 🐗</p></header>
<div class="container"><div class="card"><h2>Classificação Geral</h2><table class="ranking-table"><tbody id="tabela-ranking"></tbody></table></div>
<div class="card"><h2>Jogos & Resultados</h2><div class="nav-rodadas"><button class="btn-palpites" onclick="renderizarJogos(1)">Rodada 1</button><button class="btn-palpites" onclick="renderizarJogos(2)">Rodada 2</button></div><div id="lista-jogos-principal"></div></div>
<div class="card"><h2>Participantes</h2><div id="lista-participantes"></div></div></div>
<div id="modal-palpites" class="modal"><div class="modal-conteudo"><button class="modal-fechar" onclick="fecharPalpites()">&times;</button><h2 id="modal-titulo">Palpites</h2><div class="nav-rodadas" id="modal-nav"></div><div id="modal-lista-jogos"></div></div></div>
<script>
const dadosPalpites = { "Walishow": { j1_a: "2", j1_b: "0", j2_a: "0", j2_b: "1", j3_a: "0", j3_b: "0", j4_a: "0", j4_b: "4", j5_a: "2", j5_b: "1", j6_a: "0", j6_b: "2", j7_a: "1", j7_b: "1", j8_a: "0", j8_b: "4", j9_a: "8", j9_b: "0", j10_a: "0", j10_b: "2", j11_a: "0", j11_b: "2", j12_a: "1", j12_b: "0", j13_a: "2", j13_b: "1", j14_a: "1", j14_b: "0", j15_a: "6", j15_b: "0", j16_a: "0", j16_b: "2", j17_a: "3", j17_b: "0", j18_a: "0", j18_b: "4", j19_a: "2", j19_b: "0", j20_a: "3", j20_b: "1" }, "Paulão": { j1_a: "2", j1_b: "0", j2_a: "1", j2_b: "2", j3_a: "1", j3_b: "1", j4_a: "0", j4_b: "2", j5_a: "3", j5_b: "1", j6_a: "0", j6_b: "1", j7_a: "1", j7_b: "1", j8_a: "1", j8_b: "2", j9_a: "5", j9_b: "0", j10_a: "2", j10_b: "1", j11_a: "1", j11_b: "0", j12_a: "2", j12_b: "0", j13_a: "3", j13_b: "1", j14_a: "0", j14_b: "0", j15_a: "4", j15_b: "0", j16_a: "0", j16_b: "1", j17_a: "3", j17_b: "1", j18_a: "0", j18_b: "3", j19_a: "2", j19_b: "0", j20_a: "2", j20_b: "0" } /* ... complete com os outros usuários que já tinha ... */ };
const resultadosFinais = { j1_a:"2",j1_b:"0",j2_a:"2",j2_b:"1",j3_a:"1",j3_b:"1",j4_a:"1",j4_b:"1",j5_a:"1",j5_b:"1",j6_a:"0",j6_b:"1",j7_a:"4",j7_b:"1",j8_a:"2",j8_b:"0",j9_a:"7",j9_b:"1",j10_a:"1",j10_b:"0",j11_a:"2",j11_b:"2",j12_a:"5",j12_b:"1",j13_a:"1",j13_b:"1",j14_a:"2",j14_b:"2",j15_a:"0",j15_b:"0",j16_a:"1",j16_b:"1",j17_a:"3",j17_b:"1",j18_a:"1",j18_b:"4",j19_a:"3",j19_b:"0",j20_a:"3",j20_b:"1" };
const estruturaJogos = [ {tA:"México",tB:"África do Sul",idA:"j1_a",idB:"j1_b",rodada:1}, {tA:"Áustria",tB:"Jordânia",idA:"j20_a",idB:"j20_b",rodada:1}, {tA:"Portugal",tB:"Congo",idA:"j21_a",idB:"j21_b",rodada:2} ];
let participanteGlobal = "";

function atualizarClassificacao() {
    let ranking = Object.keys(dadosPalpites).map(p => {
        let pts = 0;
        estruturaJogos.forEach(j => {
            let rA = resultadosFinais[j.idA], pA = dadosPalpites[p][j.idA];
            if(rA && pA) { /* Lógica de pontos */ pts += (resultadosFinais[j.idA] == dadosPalpites[p][j.idA] && resultadosFinais[j.idB] == dadosPalpites[p][j.idB]) ? 10 : 3; }
        });
        return {nome: p, pontos: pts};
    }).sort((a,b) => b.pontos - a.pontos);
    document.getElementById("tabela-ranking").innerHTML = ranking.map((r,i) => `<tr><td>${i+1}º ${r.nome}</td><td>${r.pontos} pts</td></tr>`).join("");
    document.getElementById("lista-participantes").innerHTML = ranking.map(r => `<div style="margin:10px">${r.nome} <button class="btn-palpites" onclick="abrirPalpites('${r.nome}')">Ver Palpites</button></div>`).join("");
}

function renderizarJogos(r) {
    document.getElementById("lista-jogos-principal").innerHTML = estruturaJogos.filter(j=>j.rodada===r).map(j => `<div style="padding:10px">${j.tA} ${resultadosFinais[j.idA]||'-'} x ${resultadosFinais[j.idB]||'-'} ${j.tB}</div>`).join("");
}

function abrirPalpites(nome) {
    participanteGlobal = nome;
    document.getElementById("modal-nav").innerHTML = `<button class="btn-palpites" onclick="renderizarPalpites(1)">Rodada 1</button><button class="btn-palpites" onclick="renderizarPalpites(2)">Rodada 2</button>`;
    renderizarPalpites(1);
    document.getElementById("modal-palpites").classList.add("ativo");
}

function renderizarPalpites(r) {
    document.getElementById("modal-lista-jogos").innerHTML = estruturaJogos.filter(j=>j.rodada===r).map(j => `<div style="padding:10px">${j.tA} ${dadosPalpites[participanteGlobal][j.idA]} x ${dadosPalpites[participanteGlobal][j.idB]} ${j.tB}</div>`).join("");
}

function fecharPalpites(){ document.getElementById("modal-palpites").classList.remove("ativo"); }
atualizarClassificacao();
renderizarJogos(1);
</script></body></html>
